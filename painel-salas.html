<style>
/* Para trocar a cor principal, mude só --acc / --acc2 / --accbg */
:root{
  --bg:#f3f4f8;--card:#fff;--s2:#f6f6fa;--s3:#ececf3;--line:#e6e6ee;--line2:#d7d7e2;
  --text:#1c1c24;--mute:#6c6f7d;--dim:#a3a6b3;
  --acc:#a8842f;--acc2:#7d6020;--accbg:#f6efdc;
  --ok:#22a06b;--okbg:#e3f5ec;--warn:#c98a00;--warnbg:#fdf2d6;--bad:#e5484d;--badbg:#fde8e8;
  --r:16px;--r2:10px;--sh:0 1px 2px rgba(20,20,40,.04),0 4px 16px rgba(20,20,40,.05);
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--acc2);cursor:pointer;text-decoration:none;font-weight:600}
a:hover{text-decoration:underline}
.hide{display:none!important}
svg.i{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tnum{font-variant-numeric:tabular-nums}

select,input,textarea{font:inherit;color:var(--text);background:#fff;border:1px solid var(--line2);border-radius:var(--r2);padding:8px 10px;font-size:13px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
textarea{width:100%;resize:vertical}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);padding:0;vertical-align:-3px}
input[type=file]{padding:6px;font-size:12px;max-width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--acc);color:#fff;border:0;border-radius:24px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn.soft{background:#fff;color:var(--text);border:1px solid var(--line2)}
.btn.soft:hover{background:var(--s2);filter:none}
.btn.ghost{background:none;color:var(--mute)}
.btn.ghost:hover{color:var(--text);background:var(--s3)}
.btn.danger{background:var(--badbg);color:#b42318}
.btn.danger.confirm{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.note{color:var(--mute);font-size:12px;line-height:1.45}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--s3);color:var(--mute);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:500;margin:2px 4px 2px 0;white-space:nowrap}
.tag.gold{background:var(--accbg);color:var(--acc2)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.bad{background:var(--badbg);color:#b42318}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);flex-shrink:0}
.dot.on{background:var(--ok)}
.dot.off{background:var(--bad)}

/* login */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:370px;background:#fff;border-radius:20px;padding:30px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh)}
.auth-card h1{font-size:18px;font-weight:600;text-align:center;margin-bottom:6px}
.auth-card input{padding:11px 12px;font-size:14px}
.auth-card .btn{padding:12px;font-size:14px}

.auth-logo{width:170px;margin:0 auto 6px}
.msg{color:#b42318;min-height:18px;font-size:13px;text-align:center}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;margin:6px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* estrutura */
.shell{display:flex;min-height:100vh}
.side{width:250px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.side .lg{width:140px;margin:0 8px 26px;flex-shrink:0}
.nav-g{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--dim);margin:18px 12px 8px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--text);font-weight:500;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:14px;position:relative}
.nav:hover{background:var(--s2)}
.nav.on{background:var(--s3);font-weight:600}
.nav.on:before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--acc)}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px}
.side .grow{flex:1}
.main{flex:1;min-width:0;padding:18px 24px 40px}
.hdr{background:var(--card);border-radius:var(--r);padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh);margin-bottom:22px}
.burger{background:none;border:0;padding:6px;cursor:pointer;display:none}
.burger svg{width:26px;height:26px}
.hdr .sep{flex:1}
.org{display:flex;align-items:center;gap:12px;min-width:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0}
.org .u{font-size:12.5px;color:var(--acc2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org select{border:0;padding:2px 0;font-weight:600;font-size:15px;background:none;box-shadow:none;max-width:220px}
.clock{color:var(--mute);font-size:13px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:22px;font-weight:600;margin-bottom:12px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:none;border-radius:20px;padding:6px 15px;cursor:pointer;font-weight:500;font-size:14px}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--acc2);font-weight:600}
.chip .n{margin-left:6px;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 6px}
.scrim{display:none}
/* dentro do ERP (iframe): menu lateral recolhido no ☰ */
html.embed .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.15)}
html.embed .side.open{transform:none}
html.embed .scrim.open{display:block;position:fixed;inset:0;background:rgba(20,20,30,.35);z-index:50}
html.embed .burger{display:block}
html.embed .main{padding:12px 14px 30px}
html.embed .hdr{margin-bottom:14px}
@media(max-width:960px){
  .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.15)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(20,20,30,.35);z-index:50}
  .burger{display:block}
  .main{padding:12px 12px 40px}
  .clock{display:none}
}

/* cards das salas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px;align-items:start}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.rc{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--sh);border:2px solid transparent;min-width:0}
.rc.help{border-color:var(--bad)}
.rc-top{display:flex;gap:8px;margin-bottom:12px}
.rc-top select{flex:1;background:var(--s2);border-color:var(--line);font-size:13px;min-width:0}
.banner{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:12px;padding:11px;font-weight:700;letter-spacing:.08em;font-size:13.5px;margin-bottom:12px;text-transform:uppercase}
.banner.esgotado{background:#fbeedd;border:1px solid #f0cfa5;color:#b4541a}
.banner.escapou{background:var(--okbg);border:1px solid #b6e3cc;color:var(--ok)}
.banner.ajuda{background:var(--badbg);border:1px solid #f6b8b8;color:#b42318;animation:pul 1.3s ease-in-out infinite}
.banner span{flex:0 1 auto}
.banner a{color:inherit;opacity:.75}
.banner .x{background:none;border:0;cursor:pointer;color:inherit;opacity:.6;font-size:18px;padding:0 4px;line-height:1}
.banner .btn{letter-spacing:0;text-transform:none}
@keyframes pul{50%{box-shadow:0 0 0 4px rgba(229,72,77,.15)}}
.evh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:6px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line2)}
.evh b{font-size:17px}
.rc-cnt{font-size:12px;color:var(--mute);margin:-4px 0 4px;font-weight:500}
.rc-un{font-size:12px;color:var(--mute);margin:-4px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-un.ev{color:#7a3fb0;font-weight:600}
.rc-h{display:flex;align-items:center;gap:10px}
.rc-name{font-size:16.5px;font-weight:600;color:var(--acc2);text-transform:uppercase;letter-spacing:.02em;flex:1;min-width:0;line-height:1.25;cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.rc-tm{font-size:27px;font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.rc-tm.on{color:var(--text)}
.rc-tm.low{color:var(--bad)}
.cbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .1s}
.cbtn:active{transform:scale(.94)}
.cbtn svg{width:20px;height:20px;fill:currentColor;stroke:none}
.cbtn.stop{background:var(--bad)}
.cbtn.pause{background:#fff;color:var(--text);border:2px solid var(--line2)}
.cbtn.sm{width:38px;height:38px}
.cbtn.sm svg{width:15px;height:15px}
.track{position:relative;height:12px;background:var(--s3);border-radius:8px;margin:14px 0 12px}
.track>i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:8px;transition:width .9s linear}
.track .ev{position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;opacity:.95;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.track .knob{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;border:4px solid var(--acc2);transition:left .9s linear}
.rc-log{display:flex;flex-direction:column;gap:7px;font-size:14px;min-height:20px}
.rc-log div{display:flex;gap:8px;align-items:baseline;min-width:0}
.rc-log b{color:var(--acc2);font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0}
.rc-log span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-log a{font-size:13px;margin-top:2px}
.seg{display:flex;background:var(--s2);border-radius:30px;padding:4px;margin:16px 0 14px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:24px;padding:9px 8px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;color:var(--mute);font-weight:500;font-size:14px;position:relative;min-width:0}
.seg button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
.seg button.on span{display:inline}
.seg button.on{background:#fff;color:var(--acc2);font-weight:600;flex:2.4;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.seg button.on:after{content:"";position:absolute;left:14px;right:14px;bottom:-4px;height:2px;background:var(--acc);border-radius:2px}
.seg-pane{min-height:60px}
.empty-dev{text-align:center;padding:12px 6px;color:var(--mute);font-size:14px;line-height:1.9}
.empty-dev b{color:var(--text);font-weight:500;display:block}
.devr{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.devr .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wifi.on{color:var(--ok)}.wifi.off{color:var(--bad)}
.ibtn{background:none;border:0;color:var(--acc2);cursor:pointer;padding:5px;border-radius:8px;display:inline-flex;flex-shrink:0}
.ibtn:hover{background:var(--accbg)}
.ibtn:disabled{color:var(--dim);cursor:default;background:none}
.pins{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:20px;padding:5px 11px;font-size:12px;font-weight:500;cursor:pointer}
.pchip i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.pchip.on{border-color:var(--acc);background:var(--accbg)}
.pchip.on i{background:var(--acc)}
.pchip.in{cursor:default}
.stepbox{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.stepbox b{display:block;font-size:15px;margin-bottom:3px}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:30px;padding:4px;flex-shrink:0}
.stepper button{width:38px;height:38px;border:0;background:none;color:var(--acc2);font-size:22px;cursor:pointer;border-radius:50%}
.stepper button:hover{background:var(--accbg)}
.stepper button:disabled{color:var(--dim);background:none;cursor:default}
.stepper span{min-width:36px;text-align:center;font-size:16px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:0 4px;font-size:13.5px}
.tg{width:44px;height:26px;border-radius:20px;background:var(--line2);border:0;position:relative;cursor:pointer;flex-shrink:0;transition:background .15s}
.tg:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg.on{background:var(--ok)}
.tg.on:after{left:21px}
.tg:disabled{opacity:.4;cursor:default}
.abtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.abtns button{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:12px;font-weight:600;font-size:13px;cursor:pointer;text-align:left;min-width:0}
.abtns button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abtns button:hover{border-color:var(--acc);background:var(--accbg)}
.abtns button svg{color:var(--acc2)}
.abtns .win svg{color:var(--ok)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:18px 10px;cursor:pointer;text-align:center;font-weight:600;font-size:13.5px;min-height:126px}
.tile:hover{border-color:var(--acc)}
.tile .ic{width:48px;height:48px;border-radius:50%;background:var(--accbg);color:var(--acc2);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:22px;height:22px}
.tile small{display:block;font-weight:400;color:var(--dim);font-size:11.5px;margin-top:2px}
.tile:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.enh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:22px 0 10px}
.enh b{font-size:16px;font-weight:600}
.enh a{font-size:13px}
.acc{border-top:1px solid var(--line)}
.acc-r{display:flex;align-items:center;gap:8px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.acc-r .nm{flex:1;min-width:0;cursor:pointer;display:flex;align-items:center;gap:10px}
.acc-r .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-r .nm svg{color:var(--mute);transition:transform .15s}
.acc-r.open .nm svg{transform:rotate(180deg)}
.acc-r.done .nm span{color:var(--mute);text-decoration:line-through}
.tk{color:var(--dim)}
.tk.on{color:var(--ok)}
.sub-r{display:flex;align-items:flex-start;gap:8px;padding:9px 2px 9px 32px;border-bottom:1px solid var(--line);font-size:14px}
.sub-r .nm{flex:1;min-width:0;padding-top:4px}
.sub-r .txt{color:var(--mute);font-size:13px;margin-top:4px;line-height:1.4}
.sub-r.sent .nm>b{color:var(--mute)}
.sub-r .nm>b{font-weight:500}
.mini{font-size:11px;color:var(--dim);margin-left:6px;font-weight:400}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,20,30,.4);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.mbox{background:#fff;border-radius:20px;width:100%;max-width:900px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.mbox.sm{max-width:480px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh b{font-size:17px;font-weight:600}
.mclose{background:none;border:0;font-size:26px;cursor:pointer;color:var(--mute);line-height:1;padding:0 4px}
.mb{padding:0 0 18px}
.mb.pad{padding:18px 20px}

/* conteúdo de edição (dentro do modal) */
.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:13px 12px;font-size:13.5px;font-weight:500;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button.on{color:var(--acc2);border-bottom-color:var(--acc);font-weight:600}
.tabs svg.i{width:16px;height:16px}
#pane{padding:16px 20px 4px}
.row{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row:first-of-type{border-top:0}
.form{display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:11.5px;color:var(--mute);font-weight:500}
.field2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.field2{grid-template-columns:1fr}}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.panel{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.panel-h b{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.en{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.en-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--s2)}
.en-h .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.en-h .num{color:var(--dim);font-size:12px}
.hr{padding:10px 12px;border-top:1px solid var(--line)}
.hr .ht{color:var(--mute);font-size:12.5px;margin:4px 0 8px;line-height:1.45}
.ctlrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctlrow input[type=number]{width:64px}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:#fff;font-weight:700}
.chk.on{background:var(--ok);border-color:var(--ok)}
.balao{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--s2);border-radius:14px;padding:12px;margin-bottom:12px}
.linkbtn{background:none;border:0;color:var(--acc2);cursor:pointer;text-decoration:underline;font-size:12px;padding:0}
.box{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:var(--s2);flex-wrap:wrap}
.box-h .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.code{font-variant-numeric:tabular-nums;font-size:15px;letter-spacing:2px;color:var(--acc2);background:#fff;border:1px dashed var(--line2);padding:4px 10px;border-radius:8px;font-weight:600}
.pin{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
@media(max-width:600px){.pin{grid-template-columns:1fr}}
.gpio{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;font-weight:600}
.pst{width:10px;height:10px;border-radius:3px;background:var(--s3);border:1px solid var(--line2);display:inline-block}
.pst.on{background:var(--acc);border-color:var(--acc)}
.pin .nm{font-weight:600}
.pin .sub{color:var(--mute);font-size:12px;margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.addpin{padding:12px;border-top:1px dashed var(--line2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.callout{background:var(--accbg);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--acc2);line-height:1.5;margin-bottom:12px}
.callout b{color:var(--text)}
.act{padding:12px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.act-h .nm{font-weight:600;margin-bottom:3px}
.act .link{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--mute)}
.empty{color:var(--mute);padding:30px;text-align:center;border:1px dashed var(--line2);border-radius:var(--r);background:var(--card)}
.log2{display:flex;flex-direction:column;gap:9px;font-size:13.5px}
.log2 div{display:flex;gap:10px}
.log2 b{color:var(--acc2);font-variant-numeric:tabular-nums;flex-shrink:0}

/* tabelas (sessões / ranking / estatísticas) */
.tblw{overflow-x:auto;border-radius:var(--r);box-shadow:var(--sh)}
.tbl{width:100%;border-collapse:collapse;background:var(--card)}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;padding:12px 14px;background:var(--s2);white-space:nowrap}
.tbl td{padding:12px 14px;border-top:1px solid var(--line);font-size:13.5px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.kpi small{color:var(--mute);font-size:12px}
.kpi b{display:block;font-size:26px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.rk{font-weight:700;color:var(--acc2)}
.sel-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c1c24;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:86vw;text-align:center;animation:tin .2s ease-out}
/* alerta de ajuda (fixo no topo) */
.alerta{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:var(--bad);color:#fff;padding:12px 16px;border-radius:16px;box-shadow:0 12px 40px rgba(229,72,77,.45);max-width:calc(100vw - 24px);animation:pul 1.3s ease-in-out infinite;font-size:14px}
.alerta .btn{background:#fff;color:#b42318}
.alerta .sino{font-size:20px;animation:sino .6s ease-in-out infinite}
@keyframes sino{50%{transform:rotate(18deg)}}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
</style>

<body>
<div class="auth" id="boot"><div class="auth-card"><div class="lg auth-logo" role="img" aria-label="Exit Games"></div><div class="spin"></div><div class="msg" id="bm"></div></div></div>

  <form class="auth-card" id="loginForm" onsubmit="return false">

</div>
<div class="shell hide" id="app">
  <aside class="side" id="side">

    <div class="nav-g">OPERAÇÕES</div>

    <button class="nav" data-view="eventos"><svg class="i" viewBox="0 0 24 24"><path d="M3 20h18M5 20 12 4l7 16M12 4v16M9 20l3-6 3 6"/></svg>Eventos e feiras<span class="cnt hide" id="navAjudaEv"></span></button>
    <button class="nav" data-view="sessoes"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg>Sessões</button>
    <div class="nav-g">ANÁLISES</div>
    <button class="nav" data-view="ranking"><svg class="i" viewBox="0 0 24 24"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>Ranking</button>

    <button class="nav" data-view="unidades"><svg class="i" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>Unidades e eventos</button>
    <button class="nav" data-view="usuarios"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5.5-4.5-6.5"/></svg>Usuários</button>
    <div class="grow"></div>
    <button class="nav" id="out"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sair</button>
  </aside>
  <div class="scrim" id="scrim"></div>

/* ===================== TICK ===================== */
function tick(){
  var c=$('clock');if(c)c.textContent=new Date(Date.now()+G.off).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  document.querySelectorAll('[data-tm]').forEach(function(el){
    var salaId=el.dataset.tm,sala=salaById(salaId),ses=cardSes(salaId);
    var r=remSes(ses,sala);el.textContent=fh(r);
    var on=!!(ses&&ses.status==='em_jogo');el.classList.toggle('on',!!ses);el.classList.toggle('low',on&&r<=300);
  });
  document.querySelectorAll('[data-pg]').forEach(function(el){
    var salaId=el.dataset.pg,s0=salaById(salaId),ses0=cardSes(salaId),p=0;
    if(ses0){var tot=ses0.duracao_segundos||1,r0=remSes(ses0,s0);p=Math.min(100,Math.max(0,(tot-r0)/tot*100))}
    el.style.width=p+'%';var k=el.parentNode.querySelector('.knob');if(k)k.style.left=p+'%';
  });
  if(G.servidor){
    SALAS.forEach(function(sala){var ses=sesDe(sala.id);if(!ses||ses.status!=='em_jogo')return;
      if(Date.now()-(lastProc[sala.id]||0)<2000)return;lastProc[sala.id]=Date.now();
      sb.rpc('processar_sala',{p_sala:sala.id}).then(function(x){if(x.error)console.warn('processar_sala',x.error.message)});
    });
    return;
  }
  if(!can('operar'))return;
  SALAS.forEach(function(sala){
    var ses=sesDe(sala.id);if(!ses||ses.status!=='em_jogo')return;
    var r=remSes(ses,sala);
    if(r<=0){if(!busyKeys['end'+ses.id]){busyKeys['end'+ses.id]=1;encerrar(sala,ses,'tempo_esgotado')}return}
    var e=elapsedSes(ses,sala);
    enigmasDe(sala.id).forEach(function(en){dicasDe(en.id).forEach(function(d){
      if(d.modo==='automatica'&&e>=d.minuto*60){
        var done=LIB.some(function(l){return l.sessao_id===ses.id&&l.dica_id===d.id});
        var key='d'+d.id+ses.id;
        if(!done&&!busyKeys[key]){busyKeys[key]=1;liberar(sala,ses,en,d,'automatica')}
      }
    })});
    acoesDe(sala.id).forEach(function(a){
      var ok=(a.gatilho==='tempo_jogo'&&e>=a.minuto*60)||(a.gatilho==='tempo_restante'&&r<=a.minuto*60);
      var done=DISP2.some(function(x){return x.sessao_id===ses.id&&x.acao_id===a.id&&x.origem==='automatica'});
      var key='a'+a.id+ses.id;
      if(ok&&!done&&!busyKeys[key]){busyKeys[key]=1;fire(sala,ses,a,'automatica')}
    });
  });
}

async function iniciar(sala){
  var ses=sesDe(sala.id);
  if(!ses){
    var r=await sb.from('sessoes').insert({sala_id:sala.id,duracao_segundos:sala.duracao_segundos,restante_base:sala.duracao_segundos,idioma:'pt',status:'em_jogo',retomou_em:nowS(),criado_por:G.uid}).select().single();
    if(r.error){toast('Erro: '+r.error.message);return}
    ses=r.data;
    var novasAcoes=acoesDe(sala.id).filter(function(a){return a.gatilho==='inicio'});
    for(var i=0;i<novasAcoes.length;i++)await fireRaw(ses.id,novasAcoes[i],'automatica');
    await ev(ses.id,'Jogo iniciado');
  } else {
    await sb.from('sessoes').update({status:'em_jogo',retomou_em:nowS()}).eq('id',ses.id);
    await ev(ses.id,'Retomado');
  }
  await loadAll();
}
async function pausar(sala,ses){var r=remSes(ses,sala);await sb.from('sessoes').update({status:'pausada',restante_base:r,retomou_em:null}).eq('id',ses.id);await ev(ses.id,'Pausada');await loadAll()}
async function ajustarTempo(sala,ses,seg){
  if(!ses){toast('Inicie a sala primeiro.');return}
  var r=remSes(ses,sala)+seg;var novoTotal=ses.duracao_segundos+seg;
  await sb.from('sessoes').update({restante_base:Math.max(0,r),duracao_segundos:Math.max(60,novoTotal),retomou_em:ses.status==='em_jogo'?nowS():null}).eq('id',ses.id);
  await ev(ses.id,(seg>0?'+':'')+(seg/60)+' min de tempo');await loadAll()
}
async function definirTempo(sala,ses,mmss){
  if(!ses){toast('Inicie a sala primeiro.');return}
  var p=mmss.split(':');var seg=p.length===2?(+p[0]*60+ +p[1]):(+p[0]*60);if(isNaN(seg)||seg<0){toast('Tempo inválido.');return}
  await sb.from('sessoes').update({restante_base:seg,retomou_em:ses.status==='em_jogo'?nowS():null,duracao_segundos:Math.max(ses.duracao_segundos,seg)}).eq('id',ses.id);
  await ev(ses.id,'Tempo definido: '+f(seg));await loadAll()
}
async function fireRaw(sessaoId,a,origem){
  var r=await sb.from('acoes_disparadas').insert({sessao_id:sessaoId,acao_id:a.id,origem:origem});
  if(r.error&&r.error.code!=='23505')toast('Erro: '+r.error.message);
  if(!r.error&&a.alvo==='tablet_som'&&a.arquivo_som)await sb.from('sons_disparados').insert({sessao_id:sessaoId,arquivo:a.arquivo_som});
  if(!r.error)await ev(sessaoId,(origem==='automatica'?'Automático: ':'')+a.nome+(a.alvo==='tablet_som'?' (som no tablet)':''));
}
async function fire(sala,ses,a,origem){if(!a)return;if(!ses){if(a.pino_id&&G.temPlacas){await testarAcao(a);return}toast('Inicie a sala primeiro.');return}await fireRaw(ses.id,a,origem);if(origem==='manual')toast('Disparado: '+a.nome);await loadAll()}
async function liberar(sala,ses,en,d,origem){
  var texto=(d.traducoes||{})[ses.idioma]||d.texto_pt;
  var r=await sb.from('dicas_liberadas').insert({sessao_id:ses.id,dica_id:d.id,texto:texto,idioma:ses.idioma,origem:origem});
  if(r.error&&r.error.code!=='23505'){toast('Erro: '+r.error.message);return}
  if(!r.error)await ev(ses.id,'Dica ('+origem+'): '+en.nome+' — '+texto);
  if(origem==='manual')toast('Dica enviada ao tablet.');
  await loadAll()
}
async function marcarEnigma(sala,ses,en,val){
  if(!ses){toast('Inicie a sala primeiro.');return}
  if(val){var r=await sb.from('enigmas_resolvidos').insert({sessao_id:ses.id,enigma_id:en.id});if(r.error&&r.error.code!=='23505'){toast('Erro: '+r.error.message);return}}
  else{await sb.from('enigmas_resolvidos').delete().eq('sessao_id',ses.id).eq('enigma_id',en.id)}
  await ev(ses.id,(val?'Enigma marcado como resolvido: ':'Enigma reaberto: ')+en.nome);
  if(val&&en.final&&ses.status==='em_jogo'){await encerrar(sala,ses,'escapou');return}
  await loadAll()
}
async function encerrar(sala,ses,resultado){
  var r=remSes(ses,sala);
  var u=await sb.from('sessoes').update({status:'encerrada',resultado:resultado,encerrada_em:nowS(),restante_base:r,retomou_em:null}).eq('id',ses.id).neq('status','encerrada').select();
  if(u.error){toast('Erro: '+u.error.message);return}
  if(!u.data||!u.data.length){await loadAll();return} // já tinha sido encerrada (pelo servidor)
  if(resultado==='escapou'){var acs=acoesDe(sala.id).filter(function(a){return a.gatilho==='escapou'});for(var i=0;i<acs.length;i++)await fireRaw(ses.id,acs[i],'automatica')}
  await ev(ses.id,resultado==='escapou'?'Sala escapou':resultado==='cancelada'?'Sessão descartada (não conta)':(r<=0?'Tempo esgotado':'Não escaparam (encerrado pelo operador)'));
  await loadAll()
}

    var nome=$('nuNome').value.trim(),email=$('nuEmail').value.trim(),senha=$('nuSenha').value,papel=$('nuPapel').value;
    if(!email||!email.includes('@')){$('nuMsg').textContent='Digite um e-mail válido.';return}
    if(senha.length<6){$('nuMsg').textContent='A senha precisa ter pelo menos 6 caracteres.';return}
    $('nuSalvar').disabled=true;$('nuSalvar').textContent='Criando...';

    if(r.error){$('nuMsg').textContent=r.error;$('nuSalvar').disabled=false;$('nuSalvar').textContent='Criar usuário';return}
    criandoUsuario=false;var rr=await sb.from('profiles').select('id,nome,papel');USUARIOS=rr.data||[];toast('Usuário criado.');renderUsuariosBox()};

function askDeleteUser(key,doIt){if(pendingDelete===key){pendingDelete=null;doIt()}else{pendingDelete=key;renderUsuariosBox()}}
/* ===================== RENDER ===================== */
function digitando(){
  var ae=document.activeElement;
  if(!ae||!(ae.tagName==='TEXTAREA'||(ae.tagName==='INPUT'&&ae.type!=='checkbox'&&ae.type!=='file'&&ae.type!=='number')))return false;
  if(!ae.value)return false;
  if(!ae.dataset.rp){ae.dataset.rp=1;ae.addEventListener('blur',function(){delete ae.dataset.rp;if(G.renderPendente){G.renderPendente=false;setTimeout(renderAll,150)}},{once:true})}
  G.renderPendente=true;return true;
}
function renderAll(){
  if(digitando())return;
  renderUnidadeFiltro();
  document.querySelectorAll('[data-view]').forEach(function(b){b.classList.toggle('on',b.dataset.view===view)});
  var ehSalaEv=function(s){return ehEvento(unById(s.unidade_id))};
  var nA=SALAS.filter(function(s){return temAjuda(s.id)&&!ehSalaEv(s)}).length;$('navAjuda').textContent=nA;$('navAjuda').classList.toggle('hide',!nA);
  var nE=SALAS.filter(function(s){return temAjuda(s.id)&&ehSalaEv(s)}).length;if($('navAjudaEv')){$('navAjudaEv').textContent=nE;$('navAjudaEv').classList.toggle('hide',!nE)}
  renderView();renderModal();
}
function renderUnidadeFiltro(){
  var sel=$('filtroUnidade');
  sel.innerHTML=opcoesLocais(filtroUnidade,true,view==='salas'?'unidade':view==='eventos'?'evento':null);
  sel.value=filtroUnidade;
}
$('filtroUnidade').onchange=function(){filtroUnidade=this.value;renderView()};
function irPara(v){if((v==='salas'||v==='eventos')&&v!==view){filtroUnidade='todas';chip='todas'}view=v;AN.chave='';pendingDelete=null;if(v==='usuarios'){sb.from('profiles').select('id,nome,papel').then(function(r){USUARIOS=r.data||[];renderAll()})}renderAll();window.scrollTo(0,0)}
// em "todas", salas de eventos já encerrados ficam escondidas (aparecem escolhendo o evento no filtro)
function salasFiltradas(modo){return SALAS.filter(function(s){var u=unById(s.unidade_id),ev=ehEvento(u);
  if(modo==='unidade'&&ev)return false;
  if(modo==='evento'&&!ev)return false;
  if(filtroUnidade!=='todas')return s.unidade_id===filtroUnidade;
  return modo==='evento'?(verEncerrados||unAtiva(u)):unAtiva(u)})}
var verEncerrados=false;

function renderView(){
  var v=$('view');
  if(view==='salas')return renderSalas(v,'unidade');
  if(view==='eventos')return renderSalas(v,'evento');
  if(view==='unidades'){v.innerHTML='<div class="ph"><h1>Unidades e eventos</h1></div><div id="unidadesBox"></div>';return renderUnidadesBox()}
  if(view==='usuarios'){v.innerHTML='<div class="ph"><h1>Usuários</h1></div><div id="usuariosBox"></div>';return renderUsuariosBox()}
  if(view==='sessoes'||view==='ranking'||view==='stats')return renderAnalise(v);
}

/* ---------- SALAS (cards) ---------- */
function renderSalas(v,modo){
  var base=salasFiltradas(modo),ehEv=modo==='evento';
  var cont={todas:base.length,ativas:base.filter(function(s){return sesDe(s.id)}).length,ajuda:base.filter(function(s){return temAjuda(s.id)}).length,inativas:base.filter(function(s){return !sesDe(s.id)}).length};
  var lista=base.filter(function(s){return chip==='todas'||(chip==='ativas'&&sesDe(s.id))||(chip==='ajuda'&&temAjuda(s.id))||(chip==='inativas'&&!sesDe(s.id))});
  var h='<div class="ph"><div><h1>'+(ehEv?'🎪 Eventos e feiras':'Salas')+'</h1><div class="chips">'
    +[['todas','Todas'],['ativas','Ativas'],['ajuda','Ajuda solicitada'],['inativas','Inativas']].map(function(c){return '<button class="chip'+(chip===c[0]?' on':'')+'" data-chip="'+c[0]+'">'+c[1]+(c[0]==='ajuda'&&cont.ajuda?'<span class="n">'+cont.ajuda+'</span>':'')+'</button>'}).join('')
    +(ehEv?'<button class="chip'+(verEncerrados?' on':'')+'" id="verEnc">'+(verEncerrados?'Ocultar encerrados':'Mostrar encerrados')+'</button>':'')
    +'</div></div><div class="actions">'+(ehEv&&can2editar()?'<button class="btn soft" id="novoEvBtn" style="padding:11px 18px;font-size:14px">+ Novo evento</button>':'')+(can2editar()?'<button class="btn" id="novaSalaBtn" style="padding:11px 20px;font-size:14px">+ Cadastrar sala</button>':'')+'</div></div>';
  if(!ehEv){
    h+='<div class="grid">'+lista.map(cardHtml).join('')+'</div>';
    if(!lista.length)h+='<div class="empty">'+(chip==='todas'?'Nenhuma sala nesta unidade ainda.':'Nenhuma sala neste filtro.')+'</div>';
  } else {
    var evs=UNIDADES.filter(function(u){return ehEvento(u)&&(filtroUnidade==='todas'?(verEncerrados||unAtiva(u)):u.id===filtroUnidade)});
    evs.sort(function(a,b){return String(a.data_inicio||'9999').localeCompare(String(b.data_inicio||'9999'))});
    if(!evs.length)h+='<div class="empty">Nenhum evento '+(verEncerrados?'':'ativo ')+'cadastrado. '+(can2editar()?'Clique em <b>+ Novo evento</b> para criar uma feira, congresso ou ação fora das unidades.':'')+'</div>';
    evs.forEach(function(u){
      var ss=lista.filter(function(s){return s.unidade_id===u.id});
      h+='<div class="evh"><div><b>'+esc(u.nome)+'</b> <span class="tag '+(unAtiva(u)?'ok':'')+'">'+(unAtiva(u)?'ativo':'encerrado')+'</span><div class="note">'+[u.local?'📍 '+esc(u.local):'',periodoEv(u)?'📅 '+periodoEv(u):'',ss.length+' sala(s)'].filter(Boolean).join(' · ')+'</div></div>'
        +(can2editar()?'<div class="actions"><button class="btn soft sm" data-evsala="'+u.id+'">+ Sala neste evento</button><button class="btn ghost sm" data-evger="1">Editar evento</button></div>':'')+'</div>';
      h+=ss.length?'<div class="grid" style="margin-bottom:26px">'+ss.map(cardHtml).join('')+'</div>':'<div class="note" style="margin:-4px 0 26px">'+(chip==='todas'?'Nenhuma sala cadastrada neste evento ainda.':'Nenhuma sala neste filtro.')+'</div>';
    });
  }
  v.innerHTML=h;
  v.querySelectorAll('[data-chip]').forEach(function(b){b.onclick=function(){chip=b.dataset.chip;renderView()}});
  if($('novaSalaBtn'))$('novaSalaBtn').onclick=function(){abrirModal('novaSala',null,{modo:modo})};
  if($('novoEvBtn'))$('novoEvBtn').onclick=function(){irPara('unidades');setTimeout(function(){var i=$('evNome');if(i){i.scrollIntoView({block:'center'});i.focus()}},150)};
  if($('verEnc'))$('verEnc').onclick=function(){verEncerrados=!verEncerrados;renderView()};
  v.querySelectorAll('[data-evsala]').forEach(function(b){b.onclick=function(){abrirModal('novaSala',null,{modo:'evento',un:b.dataset.evsala})}});
  v.querySelectorAll('[data-evger]').forEach(function(b){b.onclick=function(){irPara('unidades')}});
  lista.forEach(function(s){bindCard(s)});
  tick();
}

function logLinhas(ses,n){
  var evs=eventosDe(ses.id),ini=inicioDe(ses.id);
  return evs.slice(0,n).map(function(e){var t=ini?fh((Date.parse(e.criado_em)-ini)/1000):new Date(e.criado_em).toLocaleTimeString('pt-BR');return '<div><b>'+t+'</b><span title="'+esc(e.detalhe)+'">'+esc(e.detalhe)+'</span></div>'}).join('');
}

function cardHtml(s){
  var ses=sesDe(s.id),fim=fimDe(s.id),cs=ses,st=ses?ses.status:'aguardando',op=can('operar');
  var r=remSes(cs,s),ajuda=temAjuda(s.id),tb=cardTab[s.id]||'disp';
  var h='<div class="rc'+(ajuda?' help':'')+'" id="card_'+s.id+'">';
  h+='<div class="rc-top"><select data-lang="'+s.id+'"'+(ses&&op?'':' disabled')+' title="Idioma das dicas">'+Object.keys(LN).map(function(k){return '<option value="'+k+'"'+(((ses&&ses.idioma)||'pt')===k?' selected':'')+'>'+BAND[k]+' '+LN[k]+'</option>'}).join('')+'</select></div>';
  if(ajuda)h+='<div class="banner ajuda">Ajuda solicitada'+(op?' <button class="btn sm" data-atender="'+s.id+'">Atendido</button>':'')+'</div>';
  if(fim&&fim.resultado!=='cancelada')h+='<div class="banner '+(fim.resultado==='escapou'?'escapou':'esgotado')+'"><span>Último jogo: '+textoResultado(fim)+'</span><a data-log="'+fim.id+'" style="font-size:12px;letter-spacing:0;text-transform:none">registro</a><button class="x" data-dispensa="'+fim.id+'" title="Limpar">×</button></div>';
  var un=unById(s.unidade_id);
  var nh=jogosHoje(s.id);
  h+='<div class="rc-cnt">🎮 '+(ses?'Jogo nº '+numJogo(ses)+' de hoje':(nh?nh+(nh===1?' jogo':' jogos')+' hoje':'Nenhum jogo hoje'))+'</div>';
  if(un)h+='<div class="rc-un'+(ehEvento(un)?' ev':'')+'">'+(ehEvento(un)?'🎪 Evento · ':'📍 ')+esc(un.nome)+(ehEvento(un)&&un.local?' · '+esc(un.local):'')+(ehEvento(un)&&periodoEv(un)?' · '+periodoEv(un):'')+(ehEvento(un)&&!unAtiva(un)?' · encerrado':'')+'</div>';
  h+='<div class="rc-h"><span class="rc-name" data-editar="'+s.id+'" title="Editar sala">'+esc(s.nome)+'</span><span class="rc-tm'+(cs?' on':'')+'" data-tm="'+s.id+'">'+fh(r)+'</span>';
  if(op){
    if(st==='em_jogo')h+='<button class="cbtn pause" data-pausar="'+s.id+'" title="Pausar">'+IC.pause+'</button><button class="cbtn stop sm" data-parar="'+s.id+'" title="Encerrar">'+IC.stop+'</button>';
    else if(st==='pausada')h+='<button class="cbtn" data-iniciar="'+s.id+'" title="Retomar">'+IC.play+'</button><button class="cbtn stop sm" data-parar="'+s.id+'" title="Encerrar">'+IC.stop+'</button>';
    else h+='<button class="cbtn" data-iniciar="'+s.id+'" title="Iniciar novo jogo">'+IC.play+'</button>';
  }
  h+='</div>';
  // trilha com marcadores de eventos
  var marc='';
  if(cs){var ini=inicioDe(cs.id),dur=cs.duracao_segundos||1;if(ini)eventosDe(cs.id).forEach(function(e){var p=(Date.parse(e.criado_em)-ini)/1000/dur*100;if(p>1&&p<99)marc+='<span class="ev" style="left:'+p.toFixed(1)+'%"></span>'})}
  h+='<div class="track"><i data-pg="'+s.id+'"></i>'+marc+'<span class="knob"></span></div>';
  h+='<div class="rc-log">';
  if(cs){var lin=logLinhas(cs,3);h+=lin||'<div><b>00:00:00</b><span>'+(st==='pausada'?'Pausada':'Jogo iniciado')+'</span></div>';if(eventosDe(cs.id).length>3)h+='<a data-log="'+cs.id+'">Ver todos</a>'}
  else h+='<div><b>00:00:00</b><span>Aguardando início</span></div>';
  h+='</div>';
  // abas
  var T=[['disp',IC.cast,'Dispositivos'],['balao',IC.dots,'Balões de dicas'],['acoes',IC.bolt,'Ações'],['mais',IC.grid,'Mais']];
  h+='<div class="seg">'+T.map(function(t){return '<button data-ctab="'+s.id+'|'+t[0]+'" class="'+(tb===t[0]?'on':'')+'" title="'+t[2]+'">'+t[1]+'<span>'+t[2]+'</span></button>'}).join('')+'</div>';
  h+='<div class="seg-pane">'+segPane(s,ses,tb)+'</div>';

  h+='<div class="enh"><b>Enigmas e dicas</b>'+(op?'<a data-inst="'+s.id+'">Enviar dica instantânea</a>':'')+'</div>';

      h+='<div class="acc-r'+(ab?' open':'')+(res?' done':'')+'"><div class="nm" data-abre="'+en.id+'">'+IC.chev+'<span>'+esc(en.nome)+'</span>'+(en.final?'<span class="tag bad" style="text-decoration:none">final</span>':'')+'</div>'
        +'<button class="ibtn tk'+(res?' on':'')+'" data-marc="'+s.id+'|'+en.id+'" title="'+(res?'Reabrir enigma':'Marcar como resolvido')+'"'+(op&&ses?'':' disabled')+'>'+IC.check+'</button></div>';
      if(ab)dicasDe(en.id).forEach(function(d){
        var env=cs&&LIB.some(function(l){return l.sessao_id===cs.id&&l.dica_id===d.id});
        var modo=d.modo==='automatica'?'auto · '+d.minuto+' min':d.modo==='balao'?'balão · '+d.minuto+' min':'';
        h+='<div class="sub-r'+(env?' sent':'')+'"><div class="nm"><b>'+esc(d.nome)+'</b>'+(modo?'<span class="mini">'+modo+'</span>':'')+(env?'<span class="mini" style="color:var(--ok)">enviada</span>':'')
          +(infoAberta[d.id]?'<div class="txt">'+esc(d.texto_pt)+'</div>':'')+'</div>'
          +'<button class="ibtn" data-info="'+d.id+'" title="Ver texto">'+IC.info+'</button>'
          +'<button class="ibtn" data-envia="'+s.id+'|'+en.id+'|'+d.id+'" title="'+(env?'Enviar de novo':'Enviar ao tablet')+'"'+(op&&ses?'':' disabled')+'>'+(env?IC.reset:IC.send)+'</button></div>';
      });
      if(ab&&!dicasDe(en.id).length)h+='<div class="sub-r"><div class="nm note">Sem dicas neste enigma.</div></div>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

    var t=tabletDe(s.id),pls=placasDe(s.id),sons=acoesDe(s.id).filter(function(a){return a.alvo==='tablet_som'&&a.gatilho==='manual'});

    if(t){var on=tabletOnline(t);h+='<div class="devr"><span class="wifi '+(on?'on':'off')+'" title="'+(on?'Online':'Offline')+'">'+(on?IC.wifi:IC.wifioff)+'</span><span class="nm">Tablet</span>'
      +(sons.length&&op?'<button class="ibtn" data-ctab="'+s.id+'|acoes" title="Sons do tablet">'+IC.sound+'</button>':'')+'</div>'}
    pls.forEach(function(pl){var on=placaOnline(pl);
      h+='<div class="devr"><span class="wifi '+(on?'on':'off')+'" data-pwifi="'+pl.id+'" title="'+esc(placaInfo(pl))+'">'+(on?IC.wifi:IC.wifioff)+'</span><span class="nm">'+esc(pl.nome)+'</span>'
        +(op?'<button class="ibtn" data-plreset="'+pl.id+'" title="Desligar tudo">'+IC.reset+'</button>':'')+'</div>';
      var ps=pinosDe(pl.id);
      if(ps.length)h+='<div class="pins">'+ps.map(function(p){var v=pl.estado&&pl.estado[String(p.pino)]&&on;
        return p.tipo==='saida'?'<button class="pchip'+(v?' on':'')+'" data-pst2="'+pl.id+'|'+p.pino+'" data-alt="'+pl.id+'|'+p.pino+'"'+(op?'':' disabled')+' title="Clique para ligar/desligar">'+'<i></i>'+esc(p.nome)+'</button>'
          :'<span class="pchip in'+(v?' on':'')+'" data-pst2="'+pl.id+'|'+p.pino+'" title="Sensor"><i></i>'+esc(p.nome)+'</span>'}).join('')+'</div>';
    });
    if(can2editar())h+='<div style="text-align:center"><a data-editar="'+s.id+'" data-etab="disp" style="font-size:13px">Gerenciar dispositivos</a></div>';
  }
  if(tb==='balao'){

    h+='<div class="stepbox"><div><b>Dicas do modo balão</b><span class="note">Quantidade de dicas disponíveis'+(ses?' · '+usados+' usada'+(usados===1?'':'s'):'')+'</span></div><div class="stepper"><button data-lim="'+s.id+'|-1"'+(op||can2editar()?'':' disabled')+'>−</button><span>'+s.limite_baloes+'</span><button data-lim="'+s.id+'|1"'+(op||can2editar()?'':' disabled')+'>+</button></div></div>';
    h+='<div class="switch"><span>Balões liberados no tablet'+(ses?'':' <span class="note">(inicie a sala)</span>')+'</span><button class="tg'+(ses&&ses.baloes_ativos?' on':'')+'" data-bl="'+s.id+'"'+(ses&&op?'':' disabled')+' aria-label="Ligar balões"></button></div>';
  }
  if(tb==='acoes'){
    var acs=acoesDe(s.id).filter(function(a){return a.gatilho==='manual'});
    if(!acs.length)h+='<div class="empty-dev"><b>Nenhuma ação manual</b>'+(can2editar()?'<a data-editar="'+s.id+'" data-etab="acoes">Cadastrar ações</a>':'')+'</div>';
    else h+='<div class="abtns">'+acs.map(function(a){return '<button data-fire="'+s.id+'|'+a.id+'"'+(op?'':' disabled')+'>'+(a.alvo==='tablet_som'?IC.sound:IC.bolt)+'<span>'+esc(a.nome)+'</span></button>'}).join('')+'</div>';
  }
  if(tb==='mais'){
    var pls2=placasDe(s.id);

      +'<button class="tile" data-editar="'+s.id+'"'+(can2editar()?'':' disabled')+'><span class="ic">'+IC.pencil+'</span>Editar sala</button>'
      +'<button class="tile" data-tempo="'+s.id+'"'+(ses&&op?'':' disabled')+'><span class="ic">'+IC.timer+'</span><span>Alterar duração da sessão'+(ses?'':'<small>Inicie a sala</small>')+'</span></button>'
      +'<button class="tile" data-guia="'+s.id+'"'+(s.guia?'':' disabled')+'><span class="ic">'+IC.book+'</span><span>Ver guia de operação'+(s.guia?'':'<small>Nenhum guia cadastrado</small>')+'</span></button>'
      +'<button class="tile" data-resetauto="'+s.id+'"'+(pls2.length&&op?'':' disabled')+'><span class="ic">'+IC.reset+'</span><span>Resetar automação'+(pls2.length?'':'<small>Nenhum dispositivo de automação</small>')+'</span></button>'
      +'</div>';
  }
  return h;

function bindCard(s){
  var c=$('card_'+s.id);if(!c)return;
  var q=function(sel,fn){c.querySelectorAll(sel).forEach(fn)};
  q('[data-iniciar]',function(b){b.onclick=function(){b.disabled=true;var fim=fimDe(s.id);if(fim)dispensadas[fim.id]=1;iniciar(s)}});
  q('[data-pausar]',function(b){b.onclick=function(){b.disabled=true;pausar(s,sesDe(s.id))}});
  q('[data-parar]',function(b){b.onclick=function(){abrirModal('encerrar',s.id)}});
  q('[data-atender]',function(b){b.onclick=async function(){var ses=sesDe(s.id);await sb.from('pedidos_ajuda').update({atendido:true}).eq('sessao_id',ses.id).eq('atendido',false);await loadAll()}});
  q('[data-dispensa]',function(b){b.onclick=function(){dispensadas[b.dataset.dispensa]=1;renderView()}});
  q('[data-lang]',function(sel){sel.onchange=async function(){var ses=sesDe(s.id);if(!ses)return;await sb.from('sessoes').update({idioma:sel.value}).eq('id',ses.id);await ev(ses.id,'Idioma: '+LN[sel.value]);await loadAll()}});
  q('[data-log]',function(a){a.onclick=function(){abrirModal('log',s.id,{sesId:a.dataset.log})}});
  q('[data-ctab]',function(b){b.onclick=function(){cardTab[s.id]=b.dataset.ctab.split('|')[1];renderView()}});
  q('[data-editar]',function(b){b.onclick=function(){if(!can2editar()&&!b.classList.contains('rc-name'))return;tab=b.dataset.etab||'enigmas';abrirModal('editar',s.id)}});
  q('[data-inst]',function(a){a.onclick=function(){if(!sesDe(s.id)){toast('Inicie a sala primeiro.');return}abrirModal('inst',s.id)}});
  q('[data-abre]',function(d){d.onclick=function(){abertos[d.dataset.abre]=!abertos[d.dataset.abre];renderView()}});
  q('[data-info]',function(b){b.onclick=function(){infoAberta[b.dataset.info]=!infoAberta[b.dataset.info];renderView()}});
  q('[data-marc]',function(b){b.onclick=function(){var k=b.dataset.marc.split('|'),ses=sesDe(s.id),en=ENIGMAS.filter(function(e){return e.id===k[1]})[0];if(!ses||!en)return;
    var res=ENRES.some(function(x){return x.sessao_id===ses.id&&x.enigma_id===en.id});
    if(!res&&en.final&&b.dataset.c!=='1'){b.dataset.c='1';toast('Enigma final: clique de novo para encerrar como "Escaparam".');setTimeout(function(){b.dataset.c=''},4000);return}

var AN={periodo:30,salaRk:null,dados:null,carregando:false,chave:''};
function tempoUsado(s){return Math.max(0,(s.duracao_segundos||0)-(+s.restante_base||0))}
async function carregarAnalise(){
  var chave=view+'|'+AN.periodo;if(AN.carregando||AN.chave===chave)return;AN.carregando=true;
  var desde=new Date(Date.now()-(view==='sessoes'?3650:AN.periodo)*864e5).toISOString();
  var q=sb.from('sessoes').select('*').eq('status','encerrada').gte('encerrada_em',desde).order('encerrada_em',{ascending:false});
  if(q.limit)q=q.limit(view==='sessoes'?150:2000);
  var r=await q;var ss=r.data||[];
  var ids=ss.map(function(x){return x.id}),dl=[];
  for(var i=0;i<ids.length;i+=200){var x=await sb.from('dicas_liberadas').select('sessao_id').in('sessao_id',ids.slice(i,i+200));dl=dl.concat(x.data||[])}
  var nd={};dl.forEach(function(d){nd[d.sessao_id]=(nd[d.sessao_id]||0)+1});
  ss.forEach(function(s){s._dicas=nd[s.id]||0});
  AN.dados=ss;AN.chave=chave;AN.carregando=false;renderView();
}
function renderAnalise(v){
  var titulo={sessoes:'Sessões',ranking:'Ranking',stats:'Estatísticas'}[view];
  if(AN.chave!==view+'|'+AN.periodo){v.innerHTML='<div class="ph"><h1>'+titulo+'</h1></div><div class="spin"></div>';AN.chave='';carregarAnalise();return}

  var ss=AN.dados.filter(function(s){return salasOk.indexOf(s.sala_id)>=0});
  var nomeSala=function(id){var s=salaById(id);return s?s.nome:'—'};
  var data=function(s){return new Date(s.encerrada_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})};
  var res=function(s){return s.resultado==='escapou'?'<span class="tag ok">Escaparam</span>':s.resultado==='cancelada'?'<span class="tag">Descartada</span>':(+s.restante_base||0)<=0?'<span class="tag bad">Tempo esgotado</span>':'<span class="tag bad">Não escaparam</span>'};

    h+=ss.length?'<div class="tblw"><table class="tbl"><tr><th>Jogo</th><th>Data</th><th>Sala</th><th>Resultado</th><th>Tempo usado</th><th>Dicas</th><th></th></tr>'+ss.map(function(s){var desc=s.resultado==='cancelada';return '<tr'+(desc?' style="opacity:.55"':'')+'><td class="rk">'+(desc?'—':'nº '+s._n)+'</td><td>'+data(s)+'</td><td>'+esc(nomeSala(s.sala_id))+'</td><td>'+res(s)+'</td><td class="tnum">'+fh(tempoUsado(s))+'</td><td>'+s._dicas+'</td><td><a data-seslog="'+s.id+'|'+s.sala_id+'">Registro</a>'+(can('operar')?' · '+(desc?'<a data-sesrest="'+s.id+'">Restaurar</a>':'<a data-sesdesc="'+s.id+'" style="color:#b42318">Descartar</a>'):'')+'</td></tr>'}).join('')+'</table></div>':'<div class="empty">Nenhuma sessão encerrada ainda.</div>';

    h+=rk.length?'<div class="tblw"><table class="tbl"><tr><th>#</th><th>Data</th><th>Tempo</th><th>Dicas</th></tr>'+rk.map(function(s,i){return '<tr><td class="rk">'+(i+1)+'º</td><td>'+data(s)+'</td><td class="tnum"><b>'+fh(tempoUsado(s))+'</b></td><td>'+s._dicas+'</td></tr>'}).join('')+'</table></div>':'<div class="empty">Nenhuma fuga registrada nesta sala no período.</div>';
  }
  if(view==='stats'){

  v.querySelectorAll('[data-sesrest]').forEach(function(a){a.onclick=async function(){var x=AN.dados.filter(function(s){return s.id===a.dataset.sesrest})[0];if(!x)return;

function pane(sala,ses){
  var h='';
  if(tab==='enigmas'){
    var usados=ses?LIB.filter(function(l){return l.sessao_id===ses.id&&l.origem==='balao'}).length:0;
    h+='<div class="balao"><div><b>Balões de dicas</b><div class="note">'+usados+' de '+sala.limite_baloes+' usados. '+(can2editar()?'<button class="linkbtn" id="editlim">alterar limite</button>':'')+(editandoLimite?' <input id="limInput" type="number" min="1" value="'+sala.limite_baloes+'" style="width:60px;padding:4px 6px"> <button class="btn sm" id="limSalvar">Salvar</button>':'')+'</div></div>'+(can('operar')?'<button class="btn'+(ses&&ses.baloes_ativos?' ok':' soft')+'" id="bl">'+(ses&&ses.baloes_ativos?'Ligados':'Desligados')+'</button>':'')+'</div>';
    if(showInstant){
      h+='<div class="inst"><b>Dica instantânea</b><textarea id="instTxt" rows="2" placeholder="Escreva a dica em português"></textarea>'+(ses&&ses.idioma!=='pt'?'<div class="note">Tradução ('+LN[ses.idioma]+'): <b id="instTr" style="color:var(--gold2)"></b></div>':'')+'<div class="actions"><button class="btn" id="instSend">Enviar ao tablet</button><button class="btn soft" id="instCancel">Cancelar</button></div></div>';
    }
    var ens=enigmasDe(sala.id);
    if(!ens.length)h+='<div class="empty">Nenhum enigma cadastrado nesta sala.</div>';

      h+='</div></div><div class="actions">';
      if(p.tipo==='saida'&&can('operar'))h+='<button class="btn soft sm" data-pcmd="'+pl.id+'|'+p.pino+'|pulso">Pulso 1s</button><button class="btn soft sm" data-pcmd="'+pl.id+'|'+p.pino+'|ligar">Ligar</button><button class="btn soft sm" data-pcmd="'+pl.id+'|'+p.pino+'|desligar">Desligar</button>';
      if(can2editar()){var pk='pino:'+p.id;h+='<button class="btn danger sm'+(pendingDelete===pk?' confirm':'')+'" data-pdel="'+p.id+'" title="Remover pino">'+(pendingDelete===pk?'Confirmar?':'×')+'</button>'}
      h+='</div></div>';
    });
    if(can2editar()){
      var usados=pins.map(function(p){return p.pino});
      var livres=PINOS_ESP32.filter(function(n){return usados.indexOf(n)<0});
      h+='<div class="addpin"><select data-np-pino="'+pl.id+'">'+livres.map(function(n){return '<option value="'+n+'">GPIO '+n+'</option>'}).join('')+'</select><input data-np-nome="'+pl.id+'" placeholder="Nome (ex.: Fechadura da porta)" style="flex:1;min-width:160px"><select data-np-tipo="'+pl.id+'"><option value="saida">Saída (relé)</option><option value="entrada">Entrada (sensor/botão)</option></select><button class="btn sm" data-np-add="'+pl.id+'">Adicionar pino</button></div>';
    }
    h+='</div>';
  });
  return h;
}

function bindPane(sala,ses){

  if($('tutAdd'))$('tutAdd').onclick=async function(){

      var path=sala.id+'/'+Date.now()+'-'+fl.name.replace(/[^a-zA-Z0-9_.-]/g,'_');
      var up=await sb.storage.from('tutoriais').upload(path,fl,{upsert:true,contentType:fl.type});
      if(up.error){btn.disabled=false;$('tutMsg').textContent='';toast('Erro ao enviar: '+up.error.message);return}
      url=sb.storage.from('tutoriais').getPublicUrl(path).data.publicUrl}
    var ord=TUT.filter(function(x){return x.sala_id===sala.id}).length;
    var r=await sb.from('sala_tutoriais').insert({sala_id:sala.id,tipo:tutTipo,titulo:tit||null,texto:txt||null,url:url||null,ordem:ord});
    btn.disabled=false;$('tutMsg').textContent='';
    if(r.error){toast('Erro: '+r.error.message);return}
    $('tutTit').value='';$('tutTxt').value='';if($('tutUrl'))$('tutUrl').value='';
    toast('Adicionado. Já aparece no tablet.');await loadAll()};
  P.querySelectorAll('[data-fire]').forEach(function(b){b.onclick=function(){fire(sala,ses,acoesDe(sala.id).filter(function(a){return a.id===b.dataset.fire})[0],'manual')}});
  P.querySelectorAll('[data-testa]').forEach(function(b){b.onclick=function(){testarAcao(ACOES.filter(function(a){return a.id===b.dataset.testa})[0])}});

  P.querySelectorAll('[data-pdel]').forEach(function(b){var key='pino:'+b.dataset.pdel;
    b.onclick=function(){askDelete(key,async function(){await sb.from('placa_pinos').delete().eq('id',b.dataset.pdel);await loadAll()})}});
  P.querySelectorAll('[data-np-add]').forEach(function(b){b.onclick=async function(){var id=b.dataset.npAdd;
