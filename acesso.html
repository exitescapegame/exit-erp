<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f3fc">
<title>Controle de Acesso — Exit Games</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:#f6f3fc;color:#2a1a52;display:flex;justify-content:center}
.wrap{width:100%;max-width:440px;padding:18px 16px 32px}
.top{background:#fff;border:1px solid #e6dcfa;border-radius:18px;padding:16px 20px 18px;color:#2a1a52;border-bottom:4px solid #C4A55B;margin-bottom:16px;box-shadow:0 2px 10px rgba(91,33,182,.07)}
.top .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.top .lg{height:38px;width:auto;display:block}
.top .mk{font-size:11px;letter-spacing:1.5px;font-weight:700;color:#5b21b6;text-align:right}
.top .un{font-size:17px;font-weight:800;margin-top:2px;color:#5b21b6}
.top .clk{font-size:40px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1}
.top .dt{font-size:13px;color:#7a6aa3;margin-top:6px;text-transform:capitalize}
.card{background:#fff;border:1px solid #e6dcfa;border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(91,33,182,.07)}
h2{font-size:15px;font-weight:700;color:#5b21b6;margin-bottom:12px}
.pes{display:flex;align-items:center;gap:12px;width:100%;background:#faf8ff;border:1.5px solid #e6dcfa;border-radius:14px;padding:14px;margin-bottom:10px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.pes:active{background:#efe8fd;border-color:#5b21b6}
.av{width:44px;height:44px;border-radius:50%;background:#5b21b6;color:#f5d565;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pes .nm{font-size:17px;font-weight:700}
.pes .st{font-size:13px;color:#7a6aa3;margin-top:2px}
.pes .st.on{color:#15803d;font-weight:600}
.sel{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sel .nm{font-size:19px;font-weight:800}
.sel .st{font-size:13px;color:#7a6aa3}
.lb{display:block;font-size:13px;font-weight:600;color:#5b4d85;margin:10px 0 6px}
.in{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1.5px solid #e6dcfa;border-radius:12px;background:#faf8ff;color:#2a1a52;outline:none}
.in:focus{border-color:#5b21b6;background:#fff}
.assn{font-size:12px;color:#7a6aa3;text-align:center;margin-top:10px;line-height:1.4}
.sig{margin-top:16px;border:1px solid #e6dcfa;background:#faf8ff;border-radius:12px;padding:12px;text-align:left}
.sigt{font-size:11px;letter-spacing:1px;font-weight:800;color:#5b21b6;text-transform:uppercase}
.sigc{font-size:18px;font-weight:800;letter-spacing:1px;margin-top:2px;font-variant-numeric:tabular-nums;color:#2a1a52}
.sigd{font-size:12px;color:#5b4d85;margin-top:6px;line-height:1.45}
.aj{border:1px solid #e6dcfa;background:#faf8ff;border-radius:12px;padding:12px;margin-bottom:10px}
.ajd{font-weight:800;font-size:15px}
.ajh{font-size:16px;font-weight:700;color:#5b21b6;margin-top:2px}
.aja{font-size:12px;color:#7a6aa3;margin-top:4px}
.ajm{font-size:13px;color:#2a1a52;margin-top:6px}
.dica{font-size:13px;color:#7a6aa3;margin:-6px 0 10px}
.dots{display:flex;justify-content:center;gap:12px;margin:8px 0 16px;min-height:18px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #5b21b6;background:#fff}
.dot.f{background:#5b21b6}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k{font:inherit;font-size:24px;font-weight:700;color:#2a1a52;background:#faf8ff;border:1.5px solid #e6dcfa;border-radius:14px;padding:14px 0;cursor:pointer}
.k:active{background:#e6dcfa}
.k.x{font-size:14px;color:#7a6aa3}
.btn{display:block;width:100%;font:inherit;font-size:19px;font-weight:800;border:0;border-radius:14px;padding:17px;margin-top:14px;cursor:pointer;background:#e7b928;color:#3b1a7a}
.btn:disabled{opacity:.45}
.btn.sec{background:#fff;color:#5b21b6;border:1.5px solid #5b21b6;font-size:16px;padding:13px}
.msg{border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;margin-bottom:12px;display:none}
.msg.err{display:block;background:#fdecec;color:#b42318;border:1px solid #f6c7c2}
.ok{text-align:center;padding:10px 0}
.ok .ic{width:84px;height:84px;border-radius:50%;margin:4px auto 14px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;background:#e8f7ee;color:#15803d;border:3px solid #15803d}
.ok .tp{font-size:14px;letter-spacing:2px;font-weight:800;color:#5b21b6}
.ok .hr{font-size:54px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.ok .who{font-size:18px;font-weight:700;margin-top:4px}
.ok .ex{font-size:14px;color:#7a6aa3;margin-top:8px}
.aviso{text-align:center;padding:20px 6px}
.aviso .big{font-size:20px;font-weight:800;color:#5b21b6;margin-bottom:10px}
.aviso p{font-size:15px;color:#5b4d85;line-height:1.5}
.load{text-align:center;color:#7a6aa3;padding:26px 0;font-size:15px}
.ft{text-align:center;font-size:11px;color:#a497c7;margin-top:16px}
</style>
</head>

    <div class="dt" id="dt">&nbsp;</div>
  </div>
  <div class="card" id="app"><div class="load">Carregando…</div></div>
  <div class="ft">Registro com a hora oficial do sistema</div>
</div>
<script>
(function(){
'use strict';
var API='https://utivaczfuuazspychdxt.supabase.co/functions/v1/ponto';
var CHAVE='';
var lista=[];      // colaboradores da unidade
var sel=null;      // colaborador escolhido
var pin='';
var modo='normal'; // 'normal' | 'criar1' (1º acesso: criar senha) | 'criar2' (repetir senha)
var pin1='';
var senhaPronta='';   // senha já digitada, guardada só até enviar (para a tela de contato)
var criandoPend=false;
var ctEmail=null, ctWhats=null; // contato digitado, guardado até concluir o envio
var ocupado=false;
var deslocMs=0;    // diferença entre relógio do servidor e do celular (só para exibir)
var app=document.getElementById('app');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ini(n){var p=String(n||'').trim().split(/\s+/);return ((p[0]||'')[0]||'').toUpperCase()+((p.length>1?p[p.length-1][0]:'')||'').toUpperCase();}

// A chave vem no QR code. Tira da barra de endereço para não ficar salva no histórico/favoritos.
try{
  var q=new URLSearchParams(location.search);
  CHAVE=(q.get('k')||'').trim();
  if(CHAVE&&history.replaceState) history.replaceState(null,'',location.pathname);
}catch(e){}

function relogio(){
  var d=new Date(Date.now()+deslocMs);
  var f=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Bahia',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);
  document.getElementById('clk').textContent=f;
  document.getElementById('dt').textContent=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Bahia',weekday:'long',day:'2-digit',month:'long'}).format(d);
}
relogio();setInterval(relogio,1000);

function chamar(corpo){
  corpo.chave=CHAVE;
  var ctl=('AbortController' in window)?new AbortController():null;
  var t=setTimeout(function(){if(ctl)ctl.abort();},20000);
  return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo),signal:ctl?ctl.signal:undefined,cache:'no-store'})
    .then(function(r){
      var dataSrv=r.headers.get('date');
      return r.json().then(function(j){j._date=dataSrv;return j;});
    })
    .finally(function(){clearTimeout(t);});
}

function telaAviso(titulo,texto,botao){
  app.innerHTML='<div class="aviso"><div class="big">'+esc(titulo)+'</div><p>'+esc(texto)+'</p></div>'+(botao?'<button class="btn sec" id="bTentar">Tentar de novo</button>':'');
  if(botao) document.getElementById('bTentar').onclick=carregar;
}

function carregar(){
  if(!CHAVE){telaAviso('Leia o QR code da loja','Para registrar seu acesso, aponte a câmera do celular para o QR code que fica na loja.',false);return;}
  app.innerHTML='<div class="load">Carregando…</div>';
  chamar({acao:'lista'}).then(function(j){
    if(!j||!j.ok){
      if(j&&j.erro==='QR_INVALIDO'){CHAVE='';telaAviso('QR code inválido','Este QR code não vale mais. Leia de novo o QR code que está na loja.',false);return;}
      telaAviso('Não foi possível carregar','Tente de novo em instantes.',true);return;
    }
    if(j._date){var ds=Date.parse(j._date);if(!isNaN(ds))deslocMs=ds-Date.now();relogio();}
    document.getElementById('un').textContent=j.unidade||'';
    lista=j.colaboradores||[];
    // Rapidez: o celular lembra quem bateu ponto nele da última vez e já abre direto no PIN.
    var lemb=null;try{lemb=localStorage.getItem('exit_ponto_quem');}catch(e){}
    var achou=null;if(lemb){for(var i=0;i<lista.length;i++){if(lista[i].id===lemb){achou=lista[i];break;}}}
    if(achou){escolher(achou);}else{telaLista();}
  }).catch(function(){telaAviso('Sem internet','Confira a conexão do celular e tente de novo.',true);});
}

function escolher(c){sel=c;pin='';pin1='';modo=c.temSenha?'normal':'criar1';telaPin('');}

function telaLista(){
  sel=null;pin='';pin1='';modo='normal';
  if(!lista.length){telaAviso('Nenhum colaborador','Não há colaboradores ativos nesta unidade.',true);return;}
  var h='<h2>Quem é você?</h2>';
  lista.forEach(function(c,i){
    h+='<button class="pes" data-i="'+i+'"><div class="av">'+esc(ini(c.nome))+'</div><div class="nm">'+esc(c.nome)+'</div></button>';
  });
  app.innerHTML=h;
  Array.prototype.forEach.call(app.querySelectorAll('.pes'),function(b){
    b.onclick=function(){escolher(lista[+b.getAttribute('data-i')]);};
  });
}

function telaPin(erro){
  var acao=modo==='criar1'?'Continuar':(modo==='criar2'?'Criar senha e registrar':'Registrar');
  var titulo=modo==='criar1'?'Primeiro acesso: crie sua senha':(modo==='criar2'?'Repita a senha':'Digite sua senha');
  var dica=modo==='criar1'?'<div class="dica">Escolha de 4 a 8 números. Só você deve saber.</div>':'';
  var h='<div class="msg'+(erro?' err':'')+'" id="msg">'+esc(erro||'')+'</div>'+
    '<div class="sel"><div class="av">'+esc(ini(sel.nome))+'</div><div class="nm">'+esc(sel.nome)+'</div></div>'+
    '<h2>'+titulo+'</h2>'+dica+'<div class="dots" id="dots"></div><div class="kp">';
  ['1','2','3','4','5','6','7','8','9'].forEach(function(n){h+='<button class="k" data-k="'+n+'">'+n+'</button>';});
  h+='<button class="k x" data-k="voltar">Não sou eu</button><button class="k" data-k="0">0</button><button class="k x" data-k="apagar">Apagar</button></div>'+
     '<button class="btn" id="bOk" disabled>'+acao+'</button>'+
     (modo==='criar1'?'':'<div class="assn">Ao registrar, você assina eletronicamente com sua senha pessoal o horário oficial do sistema.</div>');
  app.innerHTML=h;
  desenhaPin();
  Array.prototype.forEach.call(app.querySelectorAll('.k'),function(b){
    b.onclick=function(){
      if(ocupado)return;
      var k=b.getAttribute('data-k');
      if(k==='voltar'){try{localStorage.removeItem('exit_ponto_quem');}catch(e){}telaLista();return;}
      if(k==='apagar'){pin=pin.slice(0,-1);}
      else if(pin.length<8){pin+=k;}
      desenhaPin();
    };
  });
  document.getElementById('bOk').onclick=confirmar;
}

function desenhaPin(){
  var d=document.getElementById('dots');if(!d)return;
  var n=Math.max(4,pin.length),h='';
  for(var i=0;i<n;i++)h+='<div class="dot'+(i<pin.length?' f':'')+'"></div>';
  d.innerHTML=h;
  var b=document.getElementById('bOk');if(b)b.disabled=pin.length<4||ocupado;
}

function confirmar(){
  if(ocupado||!sel||pin.length<4)return;   // trava contra toque duplo
  if(modo==='criar1'){
    if(/^(\d)\1+$/.test(pin)||'0123456789'.indexOf(pin)>=0||'9876543210'.indexOf(pin)>=0){pin='';telaPin('Senha fácil demais (como 1234 ou 1111). Escolha outra.');return;}
    pin1=pin;pin='';modo='criar2';telaPin('');return;
  }
  if(modo==='criar2'&&pin!==pin1){pin='';pin1='';modo='criar1';telaPin('As duas senhas não são iguais. Comece de novo.');return;}
  var criando=(modo==='criar2');
  if(sel.precisaContato){senhaPronta=pin;criandoPend=criando;pin='';pin1='';telaContato('');return;}
  enviar(pin,criando,null,null);
}

function telaContato(erro){
  app.innerHTML='<div class="msg'+(erro?' err':'')+'" id="msg">'+esc(erro||'')+'</div>'+
    '<div class="sel"><div class="av">'+esc(ini(sel.nome))+'</div><div class="nm">'+esc(sel.nome)+'</div></div>'+
    '<h2>Para receber seus recibos</h2><div class="dica">Informe seu WhatsApp ou e-mail (pelo menos um). É pedido só uma vez.</div>'+
    '<label class="lb" for="cWh">WhatsApp com DDD</label><input class="in" id="cWh" type="tel" inputmode="tel" autocomplete="tel" placeholder="(71) 99999-9999" maxlength="20">'+
    '<label class="lb" for="cEm">E-mail</label><input class="in" id="cEm" type="email" inputmode="email" autocomplete="email" placeholder="seunome@email.com" maxlength="120">'+
    '<button class="btn" id="bCt">'+(criandoPend?'Criar senha e registrar':'Registrar')+'</button>'+
    '<div class="assn">Ao registrar, você assina eletronicamente com sua senha pessoal o horário oficial do sistema.</div>'+
    '<button class="btn sec" id="bCv">Voltar</button>';
  document.getElementById('cWh').oninput=function(){var d=this.value.replace(/\D/g,'').slice(0,11);var f=d;if(d.length>2)f='('+d.slice(0,2)+') '+d.slice(2);if(d.length>7)f='('+d.slice(0,2)+') '+d.slice(2,d.length-4)+'-'+d.slice(-4);this.value=f;};
  document.getElementById('bCv').onclick=function(){senhaPronta='';criandoPend=false;escolher(sel);};
  document.getElementById('bCt').onclick=function(){
    if(ocupado)return;
    var w=(document.getElementById('cWh').value||'').trim(), e=(document.getElementById('cEm').value||'').trim();
    var wd=w.replace(/\D/g,'');
    if(!w&&!e){telaContatoErro('Informe o WhatsApp ou o e-mail.');return;}
    if(w&&(wd.length<10||wd.length>11||wd[0]==='0')){telaContatoErro('WhatsApp inválido. Use DDD + número, ex.: (71) 99999-9999.');return;}
    if(e&&!/^[^\s@<>"']+@[^\s@<>"']+\.[a-zA-Z]{2,}$/.test(e)){telaContatoErro('E-mail inválido.');return;}
    enviar(senhaPronta,criandoPend,e||null,w||null);
  };
}
function fData(d){var p=String(d||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(d||'');}
function telaAjustes(lista){
  var h='<div class="sel"><div class="av">'+esc(ini(sel.nome))+'</div><div class="nm">'+esc(sel.nome)+'</div></div>'+
    '<h2>A gerência ajustou seu horário</h2><div class="dica">Confira antes de registrar. Sua resposta fica assinada com sua senha.</div>';
  lista.forEach(function(a){
    h+='<div class="aj"><div class="ajd">'+esc(fData(a.data))+'</div>'+
       '<div class="ajh">Entrada '+esc(a.entrada||'')+' · Saída '+esc(a.saida||'')+'</div>'+
       (a.acao==='correcao'&&(a.antesEntrada||a.antesSaida)?'<div class="aja">Antes: '+esc(a.antesEntrada||'—')+' → '+esc(a.antesSaida||'—')+'</div>':'<div class="aja">Horário lançado pela gerência</div>')+
       '<div class="ajm">Motivo: '+esc(a.motivo||'')+'</div></div>';
  });
  h+='<button class="btn" id="bAjOk">Confirmo os horários</button><button class="btn sec" id="bAjNo">Não concordo</button>';
  app.innerHTML=h;
  document.getElementById('bAjOk').onclick=function(){if(ocupado)return;enviar(senhaPronta,criandoPend,null,null,'confirmo');};
  document.getElementById('bAjNo').onclick=function(){if(ocupado)return;enviar(senhaPronta,criandoPend,null,null,'contesto');};
}
function telaContatoErro(t){var m=document.getElementById('msg');if(m){m.textContent=t;m.className='msg err';}}

function enviar(pinEnviar,criando,email,whats,resposta){
  ocupado=true;
  var b=document.getElementById('bOk')||document.getElementById('bCt')||document.getElementById(resposta==='contesto'?'bAjNo':'bAjOk');if(b){b.disabled=true;b.textContent='Registrando…';}
  var enviado=pinEnviar;pin='';pin1='';
  if(email)ctEmail=email; if(whats)ctWhats=whats;
  var corpo={acao:'bater',colaboradorId:sel.id,pin:enviado,criar:criando};
  if(ctEmail)corpo.email=ctEmail; if(ctWhats)corpo.whatsapp=ctWhats;
  if(resposta)corpo.respostaAjustes=resposta;
  chamar(corpo).then(function(j){
    if(!(j&&(j.erro==='EMAIL_INVALIDO'||j.erro==='WHATS_INVALIDO'||j.erro==='PRECISA_CONTATO'||j.erro==='CONFIRMAR_AJUSTES'))){senhaPronta='';}
    if(j&&(j.ok||(j.erro!=='EMAIL_INVALIDO'&&j.erro!=='WHATS_INVALIDO'&&j.erro!=='CONFIRMAR_AJUSTES'))){ctEmail=null;ctWhats=null;}
    ocupado=false;
    if(j&&j.ok){sel.temSenha=true;sel.precisaContato=false;modo='normal';try{localStorage.setItem('exit_ponto_quem',sel.id);}catch(e){}telaOk(j);return;}
    var e=j&&j.erro;
    if(e==='CONFIRMAR_AJUSTES'){senhaPronta=enviado;criandoPend=criando;telaAjustes(j.ajustes||[]);return;}
    if(e==='PRECISA_CONTATO'){sel.precisaContato=true;senhaPronta=enviado;criandoPend=criando;telaContato('Informe o WhatsApp ou o e-mail.');return;}
    if(e==='EMAIL_INVALIDO'){senhaPronta=enviado;criandoPend=criando;telaContato('E-mail inválido.');return;}
    if(e==='WHATS_INVALIDO'){senhaPronta=enviado;criandoPend=criando;telaContato('WhatsApp inválido. Use DDD + número.');return;}
    if(e==='CRIAR_SENHA'){sel.temSenha=false;modo='criar1';telaPin('');return;}
    if(e==='JA_TEM_SENHA'){sel.temSenha=true;modo='normal';telaPin('Este nome já tem senha criada. Digite a senha.');return;}
    if(e==='SENHA_FRACA'||e==='SENHA_FORMATO'){modo='criar1';telaPin('Senha não aceita. Use de 4 a 8 números, sem sequência fácil.');return;}
    if(e==='PIN_INCORRETO'){telaPin('Senha incorreta.'+(typeof j.restantes==='number'?' Tentativas restantes: '+j.restantes+'.':''));return;}
    if(e==='BLOQUEADO'){telaPin('Muitas tentativas erradas. Aguarde '+(j.minutos||10)+' minutos e tente de novo.');return;}
    if(e==='QR_INVALIDO'){CHAVE='';telaAviso('QR code inválido','Leia de novo o QR code que está na loja.',false);return;}
    telaPin('Não foi possível registrar. Tente de novo.');
  }).catch(function(){
    ocupado=false;
    // Sem resposta: pode ou não ter registrado. Recarrega a situação real antes de deixar tentar de novo.
    app.innerHTML='<div class="aviso"><div class="big">Sem resposta</div><p>A internet falhou na hora do registro. Toque abaixo para conferir se o registro foi feito antes de tentar de novo.</p></div><button class="btn sec" id="bTentar">Conferir</button>';
    document.getElementById('bTentar').onclick=carregar;
  });
}

function telaOk(j){
  var saida=j.tipo==='saida';
  app.innerHTML='<div class="ok"><div class="ic">✓</div><div class="tp">'+(saida?'SAÍDA REGISTRADA':'ENTRADA REGISTRADA')+'</div>'+
    (j.senhaCriada?'<div class="ex" style="margin:0 0 6px">Senha criada. Use a mesma nas próximas vezes.</div>':'')+
    (j.ajustesRespondidos?'<div class="ex" style="margin:0 0 6px">Sua resposta ao ajuste de horário foi registrada.</div>':'')+
    '<div class="hr">'+esc(j.hora||'')+'</div><div class="who">'+esc(j.nome||'')+'</div>'+
    (saida?'<div class="ex">Entrada às '+esc(j.entradaHora||'')+' · Tempo em serviço: '+esc(j.duracao||'')+'</div>':'<div class="ex">Bom trabalho!</div>')+
    (j.assinatura?'<div class="sig"><div class="sigt">Assinatura eletrônica</div><div class="sigc">'+esc(j.assinatura)+'</div>'+(j.declaracao?'<div class="sigd">'+esc(j.declaracao)+'</div>':'')+'</div>':'')+
    '</div><button class="btn sec" id="bFim">Concluir</button>';
  document.getElementById('bFim').onclick=function(){
    app.innerHTML='<div class="aviso"><div class="big">Pronto!</div><p>Seu acesso está registrado. Pode fechar esta página.</p></div>';
  };
}

carregar();
})();
</script>
</body>
</html>
