<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Como Abrir os Cadeados</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: tela de tablet deitado — vitrine de 4 cadeados; cada cadeado abre um palco animado à esquerda e os passos à direita, sincronizados. Visual único escuro (sala de escape). */
:root{
  --bg:#0b0e11;
  --panel:#141a1f;
  --panel-2:#1b232a;
  --line:#2a343c;
  --ink:#efe9dc;
  --muted:#95a09a;
  --brass:#d4ab52;
  --brass-dim:#8a6b2a;
  --signal:#e04a3f;
  --ok:#5fc48a;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(1200px 600px at 75% -10%, #1d262d 0%, transparent 60%),radial-gradient(900px 500px at -10% 110%, #17110a 0%, transparent 60%);
  color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
.app{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 24px;max-width:1280px;margin:0 auto;box-sizing:border-box}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:var(--f-mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--brass);font-weight:700}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,6vw,68px);line-height:.95;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.lead{color:var(--muted);font-size:clamp(17px,2vw,21px);margin:8px 0 0}

/* HOME */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:22px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.grid{grid-template-columns:1fr}}
.card{appearance:none;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel-2),var(--panel));border-radius:18px;padding:18px 18px 20px;color:inherit;font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .15s ease,border-color .15s ease}
.card:hover,.card:focus-visible{border-color:var(--brass-dim);transform:translateY(-2px)}
.card:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.card:active{transform:scale(.98)}
.card .art{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;border-radius:12px;background:radial-gradient(circle at 50% 40%,#232c33 0%,#11161a 75%)}
.card .art svg{width:86%;height:86%}
.card .art.photo{background:#f3f1ec;display:flex;align-items:center;justify-content:center;gap:6%;padding:8%;box-sizing:border-box}
.card .art.photo img{display:block;height:100%;max-width:100%;min-width:0;flex:0 1 auto;object-fit:contain;mix-blend-mode:multiply}
.models{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.thumbs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.thumbs figure{margin:0;background:#f3f1ec;border-radius:12px;height:clamp(96px,16vh,140px);aspect-ratio:1/1;max-width:100%;padding:10px;box-sizing:border-box;overflow:hidden}
.thumbs img{display:block;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.artwrap{position:relative;width:100%;display:flex;justify-content:center;padding-top:44px}
.artwrap .badge{top:0}
.card h2{font-family:var(--f-display);font-weight:800;font-size:34px;text-transform:uppercase;margin:4px 0 0;line-height:1}
.card p{margin:0;color:var(--muted);font-size:16px}
.card .go{margin-top:auto;font-family:var(--f-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.foot{margin-top:22px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px 18px;background:var(--panel);color:var(--ink);font-size:17px}
.foot svg{flex:none}

/* DETAIL */
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;flex:1}
@media (max-width:860px){.detail{grid-template-columns:1fr}}
.stage{border:1px solid var(--line);border-radius:20px;background:radial-gradient(circle at 50% 35%,#222b32 0%,#0f1317 78%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px;min-height:420px;position:relative;overflow:hidden}
.stage svg.lock{width:100%;max-width:440px;height:auto;max-height:42vh}
.under{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.ex-label{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);width:100%;text-align:center}
.chip{font-family:var(--f-mono);font-weight:700;font-size:22px;min-width:52px;height:52px;padding:0 12px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:#0e1215;color:var(--muted);transition:all .2s ease;box-sizing:border-box}
.chip small{font-size:11px;letter-spacing:.1em;display:block;line-height:1;margin-bottom:3px;color:inherit;opacity:.8}
.chip.col{display:flex;flex-direction:column;justify-content:center;height:60px}
.chip.on{border-color:var(--brass);color:#1a1307;background:var(--brass);box-shadow:0 0 24px rgba(212,171,82,.45)}
.chip.done{border-color:var(--brass-dim);color:var(--brass)}
.badge{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.06em;text-transform:uppercase;padding:6px 18px;border-radius:999px;background:var(--brass);color:#1a1307;opacity:0;transition:opacity .25s ease;white-space:nowrap;pointer-events:none}
.badge.show{opacity:1}
.badge.ok{background:var(--ok);color:#06210f}
.readout{font-family:var(--f-mono);font-size:15px;color:var(--muted);letter-spacing:.06em}
.readout b{color:var(--ink);font-size:24px;margin-left:6px}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.side h1{font-size:clamp(40px,5vw,60px)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);transition:border-color .25s ease,background .25s ease,opacity .25s ease;opacity:.55}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;width:52px;height:52px;display:grid;place-items:center;border-radius:12px;background:#0e1215;color:var(--muted);transition:all .25s ease}
.steps li b{display:block;font-size:21px;font-weight:700;color:var(--ink);margin-bottom:2px}
.steps li span{color:#c9cfc8;font-size:18px}
.steps li.on{opacity:1;border-color:var(--brass);background:linear-gradient(180deg,#221d12,var(--panel))}
.steps li.on::before{background:var(--brass);color:#1a1307}
.steps li.done{opacity:.85}
.steps li.done::before{color:var(--brass)}
.tip{border-left:4px solid var(--signal);background:#1d1414;border-radius:0 14px 14px 0;padding:14px 18px;font-size:18px}
.tip b{color:#ff8a80;margin-right:6px}
.bar{display:flex;gap:12px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.btn{appearance:none;font:inherit;font-weight:700;font-size:20px;border-radius:14px;padding:16px 22px;min-height:60px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#1a1307}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn:active{transform:scale(.97)}
.btn svg{width:22px;height:22px}
.flex1{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body style="margin:0">


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gShackle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c747b"/><stop offset=".35" stop-color="#f4f6f8"/><stop offset=".55" stop-color="#c3c9ce"/><stop offset="1" stop-color="#5d656c"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4473c"/><stop offset=".45" stop-color="#9e2620"/><stop offset=".7" stop-color="#b83228"/><stop offset="1" stop-color="#5c1411"/>
    </linearGradient>
    <linearGradient id="gGun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a535b"/><stop offset=".08" stop-color="#2f363c"/><stop offset=".85" stop-color="#1d2226"/><stop offset="1" stop-color="#121518"/>
    </linearGradient>
    <linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f3f5"/><stop offset=".3" stop-color="#a7afb6"/><stop offset=".55" stop-color="#dfe3e6"/><stop offset=".8" stop-color="#8a9299"/><stop offset="1" stop-color="#c9ced2"/>
    </linearGradient>
    <radialGradient id="gKnob" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#d3d8dc"/><stop offset=".8" stop-color="#7d868d"/><stop offset="1" stop-color="#4c545a"/>
    </radialGradient>
    <radialGradient id="gFace" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#2c3237"/><stop offset="1" stop-color="#0d1013"/>
    </radialGradient>
    <linearGradient id="gWheel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15191c"/><stop offset=".5" stop-color="#2b3238"/><stop offset="1" stop-color="#15191c"/>
    </linearGradient>
    <linearGradient id="gCyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".92"/><stop offset=".3" stop-color="#000" stop-opacity=".15"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset=".7" stop-color="#000" stop-opacity=".15"/><stop offset="1" stop-color="#000" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="gBlack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5056"/><stop offset=".18" stop-color="#25292d"/><stop offset=".75" stop-color="#151719"/><stop offset="1" stop-color="#0a0b0c"/>
    </linearGradient>
    <radialGradient id="gKnobBlack" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#5d646b"/><stop offset=".3" stop-color="#262a2e"/><stop offset="1" stop-color="#070809"/>
    </radialGradient>
    <radialGradient id="gFaceRed" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#e5463a"/><stop offset=".7" stop-color="#b8261d"/><stop offset="1" stop-color="#7d1510"/>
    </radialGradient>
    <radialGradient id="gKnobRed" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#ff7a6e"/><stop offset=".35" stop-color="#d63a2f"/><stop offset="1" stop-color="#7a140f"/>
    </radialGradient>
    <linearGradient id="gCylH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".85"/><stop offset=".28" stop-color="#000" stop-opacity=".1"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset=".72" stop-color="#000" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="gChromeRing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7f8"/><stop offset=".5" stop-color="#9ba3a9"/><stop offset="1" stop-color="#e3e6e8"/>
    </linearGradient>
    <pattern id="pDots" width="11" height="11" patternUnits="userSpaceOnUse">
      <rect width="11" height="11" fill="#0c0e10"/><rect x="1.5" y="1.5" width="8" height="8" rx="2" fill="#1d2125"/><rect x="2" y="2" width="7" height="3" rx="1.5" fill="#2a2f34"/>
    </pattern>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="mArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d4ab52"/>
    </marker>
  </defs>
</svg>

<div class="app" id="app"></div>

<script>
(function(){
"use strict";
const app = document.getElementById('app');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let run = 0;

/* ---------- tempo ---------- */
const ease = p => p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
function tween(dur, fn, e){
  e = e || ease; const my = run;
  if (reduce) dur = Math.min(dur, 60);
  return new Promise((res, rej) => {
    const t0 = performance.now();
    function f(now){
      if (my !== run) { rej('cancel'); return; }
      const p = Math.min(1, (now - t0) / dur);
      fn(e(p));
      if (p < 1) requestAnimationFrame(f); else res();
    }
    requestAnimationFrame(f);
  });
}
function wait(ms){
  const my = run; if (reduce) ms = Math.min(ms, 400);
  return new Promise((res, rej) => setTimeout(() => my === run ? res() : rej('cancel'), ms));
}

/* ---------- desenhos ---------- */
function directionalSVG(){
  const arrows = {
    up:    'M200 213 l14 18 h-28z',
    right: 'M292 305 l-18 14 v-28z',
    down:  'M200 397 l14 -18 h-28z',
    left:  'M108 305 l18 14 v-28z'
  };
  let a = '';
  for (const k in arrows) a += `<path data-arrow="${k}" d="${arrows[k]}" fill="#c9cdd1"/>`;
  return `<svg class="lock" viewBox="0 0 400 470" role="img" aria-label="Cadeado direcional">
  <g filter="url(#fShadow)">
    <g data-shackle><path d="M140 270 V112 A60 60 0 0 1 260 112 V270" fill="none" stroke="url(#gShackle)" stroke-width="26" stroke-linecap="round"/>
      <path d="M140 270 V112 A60 60 0 0 1 260 112 V270" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3" transform="translate(-6 0)"/></g>
    <path d="M70 230 Q70 180 120 180 H280 Q330 180 330 230 V360 Q330 440 200 440 Q70 440 70 360 Z" fill="url(#gBlack)"/>
    <path d="M76 232 Q76 186 122 186 H278 Q324 186 324 232 V358 Q324 434 200 434 Q76 434 76 358 Z" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="200" cy="305" r="62" fill="none" stroke="url(#gChromeRing)" stroke-width="5"/>
    ${a}
    <g data-knob>
      <circle cx="200" cy="309" r="56" fill="#000" opacity=".55"/>
      <circle cx="200" cy="305" r="55" fill="url(#gKnobBlack)"/>
      <ellipse cx="184" cy="284" rx="26" ry="14" fill="#fff" opacity=".12"/>
    </g>
  </g>
  <text data-click x="200" y="40" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="22" fill="#d4ab52" opacity="0">CLIQUE!</text>
</svg>`;
}

function wheelLockSVG(items, startIdx, label){
  const n = startIdx.length;
  const winY = 182, winH = 112, center = winH/2;
  const ww = n === 4 ? 62 : 50, gap = n === 4 ? 14 : 10;
  const SP = n === 4 ? 46 : 44, fs = n === 4 ? 36 : 32;
  const total = n*ww + (n-1)*gap, x0 = 230 - total/2;
  let wheels = '';
  for (let i = 0; i < n; i++){
    const x = x0 + i*(ww+gap);
    let strip = '';
    for (let k = -3; k < 64; k++){
      const v = items[((k % items.length) + items.length) % items.length];
      strip += `<text x="${ww/2}" y="${k*SP + fs*0.36}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="${fs}" fill="#f2efe6">${v}</text>`;
    }
    wheels += `<g data-wheelbox="${i}">
      <rect x="${x-3}" y="${winY-3}" width="${ww+6}" height="${winH+6}" rx="12" fill="none" stroke="#d4ab52" stroke-width="3" opacity="0" data-hl="${i}"/>
      <svg x="${x}" y="${winY}" width="${ww}" height="${winH}" overflow="hidden">
        <rect width="${ww}" height="${winH}" rx="8" fill="url(#gWheel)"/>
        <g data-strip="${i}" transform="translate(0 ${center - startIdx[i]*SP})">${strip}</g>
        <rect width="${ww}" height="${winH}" rx="8" fill="url(#gCyl)"/>
      </svg></g>`;
  }
  return `<svg class="lock" viewBox="0 0 460 380" role="img" aria-label="${label}" data-sp="${SP}" data-center="${center}">
  <g filter="url(#fShadow)">
    <g data-shackle><path d="M120 240 V110 A70 70 0 0 1 260 110 M260 110 A70 70 0 0 1 340 110 V240" fill="none" stroke="none"/>
      <path d="M118 240 V118 A62 62 0 0 1 180 56 H280 A62 62 0 0 1 342 118 V240" fill="none" stroke="url(#gShackle)" stroke-width="22" stroke-linecap="round"/></g>
    <rect x="40" y="150" width="380" height="180" rx="70" fill="url(#gSteel)"/>
    <rect x="46" y="156" width="368" height="168" rx="65" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
    <rect x="${x0-18}" y="${winY-14}" width="${total+36}" height="${winH+28}" rx="16" fill="#07090b"/>
    <rect x="${x0-14}" y="${winY+center-24}" width="${total+28}" height="48" fill="#e04a3f" opacity=".14" data-band/>
    ${wheels}
    <path d="M${x0-16} ${winY+center} l-12 -10 v20z" fill="#e04a3f" data-mk/>
    <path d="M${x0+total+16} ${winY+center} l12 -10 v20z" fill="#e04a3f" data-mk/>
    <rect x="${x0-14}" y="${winY+center-1}" width="${total+28}" height="2" fill="#e04a3f" opacity=".0" data-line/>
  </g>
</svg>`;
}

function stackLockSVG(startIdx){
  const n = startIdx.length, wx = 196, ww = 120, wh = 46, gapY = 14, y0 = 236;
  const SP = 36, fs = 30, center = ww/2, colX = wx + center;
  let wheels = '';
  for (let i = 0; i < n; i++){
    const y = y0 + i*(wh+gapY);
    let strip = '';
    for (let k = -4; k < 64; k++){
      const v = ((k % 10) + 10) % 10;
      strip += `<text x="${k*SP}" y="${wh/2 + fs*0.36}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="${fs}" fill="#15181b">${v}</text>`;
    }
    wheels += `<g>
      <rect x="${wx-3}" y="${y-3}" width="${ww+6}" height="${wh+6}" rx="10" fill="none" stroke="#d4ab52" stroke-width="3" opacity="0" data-hl="${i}"/>
      <svg x="${wx}" y="${y}" width="${ww}" height="${wh}" overflow="hidden">
        <rect width="${ww}" height="${wh}" rx="6" fill="url(#gSteel)"/>
        <g data-strip="${i}" transform="translate(${center - startIdx[i]*SP} 0)">${strip}</g>
        <rect width="${ww}" height="${wh}" rx="6" fill="url(#gCylH)"/>
      </svg></g>`;
  }
  const bandTop = y0 - 14, bandH = n*wh + (n-1)*gapY + 28;
  return `<svg class="lock" viewBox="0 0 380 520" role="img" aria-label="Cadeado de números" data-sp="${SP}" data-center="${center}" data-axis="x">
  <g filter="url(#fShadow)">
    <g data-shackle><path d="M110 260 V128 A72 72 0 0 1 254 128 V260" fill="none" stroke="url(#gShackle)" stroke-width="28" stroke-linecap="round"/></g>
    <rect x="56" y="196" width="250" height="300" rx="18" fill="url(#gBlack)"/>
    <rect x="62" y="202" width="238" height="288" rx="14" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2"/>
    <rect x="76" y="222" width="104" height="252" rx="6" fill="url(#pDots)"/>
    <rect x="186" y="208" width="112" height="276" rx="10" fill="#0d0f11"/>
    <rect x="${colX-20}" y="${bandTop}" width="40" height="${bandH}" fill="#e04a3f" opacity=".14" data-band/>
    ${wheels}
    <path d="M${colX} ${bandTop-2} l-10 -13 h20z" fill="#e04a3f" data-mk/>
    <path d="M${colX} ${bandTop+bandH+2} l-10 13 h20z" fill="#e04a3f" data-mk/>
    <rect x="${colX-1}" y="${bandTop}" width="2" height="${bandH}" fill="#e04a3f" opacity="0" data-line/>
  </g>
</svg>`;
}

function dialSVG(){
  const cx = 210, cy = 300;
  let ticks = '', nums = '';
  for (let i = 0; i < 40; i++){
    const a = i*9*Math.PI/180;
    const r1 = 112, r2 = i % 5 === 0 ? 98 : 105;
    const sx = cx + r1*Math.sin(a), sy = cy - r1*Math.cos(a);
    const ex = cx + r2*Math.sin(a), ey = cy - r2*Math.cos(a);
    ticks += `<line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#e9e5da" stroke-width="${i%5===0?3:1.6}" stroke-linecap="round"/>`;
    if (i % 5 === 0){
      const rn = 82, nx = cx + rn*Math.sin(a), ny = cy - rn*Math.cos(a);
      nums += `<text x="${nx.toFixed(1)}" y="${(ny+6).toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="17" fill="#f2efe6" transform="rotate(${(i*9).toFixed(1)} ${nx.toFixed(1)} ${ny.toFixed(1)})">${i}</text>`;
    }
  }
  return `<svg class="lock" viewBox="0 0 420 470" role="img" aria-label="Cadeado de disco">

    <g data-dial>
      <circle cx="${cx}" cy="${cy}" r="117" fill="url(#gFaceRed)"/>
      ${ticks}${nums}
      <circle cx="${cx}" cy="${cy+4}" r="48" fill="#000" opacity=".35"/>
      <circle cx="${cx}" cy="${cy}" r="46" fill="url(#gKnobRed)"/>
      <circle cx="${cx}" cy="${cy}" r="42" fill="none" stroke="#5a0d09" stroke-opacity=".55" stroke-width="5" stroke-dasharray="2 4"/>
      <circle cx="${cx}" cy="${cy}" r="30" fill="url(#gKnobRed)"/>
    </g>
    <path d="M202 168 h16 l-8 13z" fill="#3a0b08"/>
  </g>
  <g data-cw opacity="0" filter="url(#fGlow)"><path d="M${cx+60} ${cy-150} A162 162 0 0 1 ${cx+150} ${cy-40}" fill="none" stroke="#d4ab52" stroke-width="7" stroke-linecap="round" marker-end="url(#mArrow)"/></g>
  <g data-ccw opacity="0" filter="url(#fGlow)"><path d="M${cx-150} ${cy-40} A162 162 0 0 1 ${cx-60} ${cy-150}" fill="none" stroke="#d4ab52" stroke-width="7" stroke-linecap="round" marker-start="url(#mArrow)"/></g>
</svg>`;

function home(){
  run++;
  let cards = '';
  for (const k of ORDER){
    const L = LOCKS[k];
    cards += `<button class="card" data-go="${k}" type="button">
      <div class="art photo">${L.photos.map(p => `<img src="${p[0]}" alt="${p[1]}">`).join('')}</div>
      <h2>${L.name}</h2><p>${L.blurb}</p><span class="go">Ver como abrir →</span></button>`;
  }
  app.innerHTML = `<header class="top"><div><h1>Como abrir os cadeados</h1><p class="lead">Toque no cadeado que você encontrou.</p></div>
    <div class="brand"><b>Exit Games</b> · Guia da sala</div></header>
    <div class="grid">${cards}</div>
    <div class="foot">${ICON_HAND}<span><b>Nunca force um cadeado.</b> Se travar, peça ajuda ao game master.</span></div>`;
  app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.go; }));
  window.scrollTo(0,0);
}

function detail(k){
  const L = LOCKS[k];
  const steps = L.steps.map(s => `<li><div><b>${s[0]}</b><span>${s[1]}</span></div></li>`).join('');
  app.innerHTML = `<header class="top"><div class="brand"><b>Exit Games</b> · Guia da sala</div></header>
  <div class="detail">
    <section class="stage" aria-label="Demonstração animada">
      <div class="models"><div class="ex-label">${L.photos.length > 1 ? 'São estes cadeados' : 'É este cadeado'}</div>
        <div class="thumbs">${L.photos.map(p => `<figure><img src="${p[0]}" alt="${p[1]}"></figure>`).join('')}</div></div>
      <div class="artwrap"><div class="badge" data-badge>Aberto!</div>
      <div data-art style="width:100%;display:flex;justify-content:center">${L.art()}</div></div>
      <div class="under">${L.under}</div>
    </section>
    <section class="side">
      <h1>Cadeado ${L.name}</h1>
      <ol class="steps">${steps}</ol>
      <div class="tip"><b>${L.tip[0]}</b>${L.tip[1]}</div>
      <div class="bar">
        <button class="btn" type="button" data-back>${ICON_BACK}Voltar</button>
        <span class="flex1"></span>

      </div>
    </section>
  </div>`;
  app.querySelector('[data-back]').addEventListener('click', () => { location.hash = ''; });
  app.querySelector('[data-replay]').addEventListener('click', () => start(k));
  window.scrollTo(0,0);
  start(k);
}

function start(k){
  run++;
  const L = LOCKS[k];
  app.querySelector('[data-art]').innerHTML = L.art();
  app.querySelectorAll('[data-chip]').forEach(c => c.classList.remove('on','done'));
  const r = app.querySelector('[data-read]'); if (r) r.textContent = '0';
  badge(false);
  setStep(-1);
  L.play().catch(() => {});
}

/* ---------- auxiliares ---------- */
const $ = s => app.querySelector(s);
const $$ = s => app.querySelectorAll(s);
function setStep(i){
  $$('.steps li').forEach((li, j) => { li.classList.toggle('on', j === i); li.classList.toggle('done', j < i); });
}
function chip(i, state){
  const c = $(`[data-chip="${i}"]`); if (!c) return;
  c.classList.remove('on','done'); if (state) c.classList.add(state);
}
function badge(on, text, ok){
  const b = $('[data-badge]'); if (!b) return;
  if (text) b.textContent = text;
  b.classList.toggle('ok', !!ok);
  b.classList.toggle('show', !!on);
}
function setY(el, y){ el.setAttribute('transform', `translate(0 ${y})`); }
async function openShackle(){
  const s = $('[data-shackle]');
  await tween(700, p => setY(s, -46*p));
  badge(true, 'Aberto!', true);
  await wait(1800);
}

/* ---------- animações ---------- */
async function playDirectional(){
  const sh = $('[data-shackle]'), knob = $('[data-knob]'), click = $('[data-click]');
  await wait(700);
  setStep(0); badge(true, 'Zerar');
  for (let i = 0; i < 3; i++){
    await tween(160, p => setY(sh, 14*p));
    click.setAttribute('opacity', '1');
    await tween(220, p => setY(sh, 14*(1-p)));
    await wait(220);
    click.setAttribute('opacity', '0');
    await wait(120);
  }
  badge(false);
  await wait(600);
  setStep(1);
  const seq = [['up',0,-1],['right',1,0],['down',0,1],['left',-1,0]];
  for (let i = 0; i < seq.length; i++){
    const [k, dx, dy] = seq[i];
    const arrow = $(`[data-arrow="${k}"]`);
    chip(i, 'on'); arrow.setAttribute('fill', '#d4ab52'); arrow.setAttribute('filter', 'url(#fGlow)');
    await tween(380, p => knob.setAttribute('transform', `translate(${dx*26*p} ${dy*26*p})`));
    await wait(260);
    await tween(300, p => knob.setAttribute('transform', `translate(${dx*26*(1-p)} ${dy*26*(1-p)})`));
    arrow.setAttribute('fill', '#c9cdd1'); arrow.removeAttribute('filter');
    chip(i, 'done');
    await wait(260);
  }
  await wait(400);
  setStep(2);
  await openShackle();
}

async function playWheels(items, startIdx, target){
  const n = startIdx.length, len = items.length;
  const svg = $('svg.lock'), SP = +svg.dataset.sp, C = +svg.dataset.center, horiz = svg.dataset.axis === 'x';
  const cur = startIdx.slice();
  const set = i => {
    const el = $(`[data-strip="${i}"]`), off = C - cur[i]*SP;
    el.setAttribute('transform', horiz ? `translate(${off} 0)` : `translate(0 ${off})`);
  };
  await wait(700);
  setStep(0);
  for (let i = 0; i < n; i++){
    const hl = $(`[data-hl="${i}"]`); hl.setAttribute('opacity', '1');
    let diff = ((target[i] - (cur[i] % len)) + len) % len;
    if (diff < 2) diff += len > 10 ? 0 : 10;
    if (diff === 0) diff = len;
    const from = cur[i];
    let to = from + diff;
    if (i === n-1) to += 0.38; /* última rodinha para fora do centro, de propósito */
    await tween(500 + Math.min(diff, 12)*70, p => { cur[i] = from + (to-from)*p; set(i); });
    hl.setAttribute('opacity', '0');
    await wait(180);
  }
  await wait(500);
  setStep(1);
  const band = $('[data-band]'), line = $('[data-line]'), last = n-1;
  const hl = $(`[data-hl="${last}"]`);
  badge(true, horiz ? 'Fora da fila' : 'Fora da linha');
  for (let k = 0; k < 2; k++){
    hl.setAttribute('opacity', '1'); band.setAttribute('opacity', '.4'); line.setAttribute('opacity', '1');
    await wait(320);
    hl.setAttribute('opacity', '0'); band.setAttribute('opacity', '.14'); line.setAttribute('opacity', '0');
    await wait(260);
  }
  hl.setAttribute('opacity', '1');
  const f = cur[last], t = Math.round(f);
  await tween(450, p => { cur[last] = f + (t-f)*p; set(last); });
  hl.setAttribute('opacity', '0');
  band.setAttribute('opacity', '.4'); line.setAttribute('opacity', '1');
  badge(true, 'Alinhado', true);
  await wait(1100);
  band.setAttribute('opacity', '.14'); line.setAttribute('opacity', '0');
  badge(false);
  await wait(300);
  setStep(2);
  await openShackle();
}

async function playDial(){
  const dial = $('[data-dial]'), cw = $('[data-cw]'), ccw = $('[data-ccw]'), read = $('[data-read]');
  let th = 0;
  const show = () => {
    dial.setAttribute('transform', `rotate(${th} 210 300)`);
    read.textContent = String(((-Math.round(th/9) % 40) + 40) % 40);
  };
  async function turn(delta, dur){
    const f = th;
    await tween(dur, p => { th = f + delta*p; show(); });
  }
  show();
  await wait(700);
  setStep(0); chip(0, 'on'); cw.setAttribute('opacity', '1'); badge(true, '→ Direita');
  await turn(3*360 + 28*9, 4200);
  chip(0, 'done'); cw.setAttribute('opacity', '0');
  await wait(700);
  setStep(1); chip(1, 'on'); ccw.setAttribute('opacity', '1'); badge(true, '← Esquerda');
  await turn(-(40 + 18)*9, 3000);
  chip(1, 'done'); ccw.setAttribute('opacity', '0');
  await wait(700);
  setStep(2); chip(2, 'on'); cw.setAttribute('opacity', '1'); badge(true, '→ Direita');
  await turn(22*9, 1600);
  chip(2, 'done'); cw.setAttribute('opacity', '0');
  badge(false);
  await wait(500);
  setStep(3);
  await openShackle();
}

/* ---------- rotas ---------- */
function route(){
  const k = location.hash.replace('#','');
  if (LOCKS[k]) detail(k); else home();
}
window.addEventListener('hashchange', route);
route();

/* manter a tela do tablet acesa (opcional) */
let lock = null;
document.addEventListener('pointerdown', async () => {
  if (lock || !('wakeLock' in navigator)) return;
  try { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } catch (e) {}
}, { passive: true });
})();
</script>
